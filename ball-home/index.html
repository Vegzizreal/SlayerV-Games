<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBALL — Update v4.6.1</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0e0d12; color:#f2f0eb; margin:0; padding:32px 20px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 6px; }
  p { line-height:1.55; color:#cfccc4; }
  .door { background:#191721; border:1px solid #2c2a38; border-radius:14px; margin:20px 0; overflow:hidden; }
  .door.lit { border-color:#7c5cff; box-shadow:0 0 0 1px #7c5cff; }
  .doorHead { display:flex; justify-content:space-between; align-items:center;
              padding:16px 20px; font-size:20px; color:#f2f0eb; cursor:pointer;
              user-select:none; -webkit-user-select:none; }
  .doorHead .chev { color:#9a97a8; transition:transform .15s; }
  .ver { color:#b7a6ff; font-weight:600; white-space:nowrap; }
  .door.closed .doorHead .chev { transform:rotate(-90deg); }
  .doorBody { padding:0 20px 20px; }
  .door.closed .doorBody { display:none; }
  .hint { margin:0; padding:0 20px 14px; font-size:15px; }
  .door:not(.closed) .hint { display:none; }
  button { display:block; width:100%; font-size:20px; padding:16px; margin:14px 0;
           border:0; border-radius:12px; background:#7c5cff; color:#fff; }
  button:disabled { background:#3a3750; color:#9a97a8; }
  esp-web-install-button { --esp-tools-button-color:#7c5cff; }
  .bar { height:18px; background:#26232f; border-radius:9px; overflow:hidden; margin:12px 0; }
  .bar > div { height:100%; width:0%; background:#7c5cff; transition:width .15s; }
  .big { font-size:19px; color:#f2f0eb; }
  .warn { color:#ffb454; }
  .bad { color:#ff7a7a; }
  .ok { color:#8be28b; }
  code { background:#26232f; padding:1px 6px; border-radius:6px; }
  pre { background:#14121c; border:1px solid #2c2a38; border-radius:10px;
        padding:12px; font-size:12.5px; line-height:1.45;
        white-space:pre-wrap; word-break:break-word; color:#cfccc4; }
  #labDl { display:none; color:#b7a6ff; font-size:16px; }
</style>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
<main>
  <h1>👻 VBALL — Update <span class="ver" id="verTitle">v4.6.1</span></h1>

  <section class="door" id="doorA">
    <div class="doorHead" id="headA"><span>Bluetooth update (phone) <span class="ver" id="verA"></span></span><span class="chev">▾</span></div>
    <p class="hint" id="hintA"></p>
    <div class="doorBody" id="bodyA">
      <button id="updateBtn">Update</button>
      <button id="labBtn" disabled>Read LAB results</button>
      <pre id="labOut" hidden></pre>
      <p><a id="labDl" download="lab-results.txt">Download lab-results.txt</a></p>
      <div class="bar"><div id="fill"></div></div>
      <p class="big" id="status">Not connected.</p>
      <p id="versions"></p>
      <p class="warn" id="note"></p>
    </div>
  </section>

  <section class="door" id="doorB">
    <div class="doorHead" id="headB"><span>Cable update (PC) <span class="ver" id="verB"></span></span><span class="chev">▾</span></div>
    <p class="hint" id="hintB"></p>
    <div class="doorBody" id="bodyB">
      <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
    </div>
  </section>
</main>

<script>
"use strict";
/* ==== Doors: capability lighting =====================================
 * On load, light the door that can work on THIS device and collapse
 * the other (still openable). Neither door ever blocks the other. */
const hasBt = !!navigator.bluetooth;
const hasSerial = "serial" in navigator;

const doorA = document.getElementById("doorA"), doorB = document.getElementById("doorB");
let bleDoorSeen = false;   /* the load path below calls bleDoorOpened() before the Door A section runs (TDZ fix, 2026-10-28) */
const hintA = document.getElementById("hintA"), hintB = document.getElementById("hintB");

function setDoor(door, open) { door.classList.toggle("closed", !open); }
function toggleDoor(door) {
  const opening = door.classList.contains("closed");
  setDoor(door, opening);
  if (opening && door === doorA) bleDoorOpened();
}
document.getElementById("headA").addEventListener("click", () => toggleDoor(doorA));
document.getElementById("headB").addEventListener("click", () => toggleDoor(doorB));

hintA.textContent = hasBt ? "" : "No Bluetooth here.";
hintB.textContent = hasSerial ? "" : "No USB serial here.";

if (hasBt) doorA.classList.add("lit");
if (hasSerial) doorB.classList.add("lit");
setDoor(doorA, hasBt);
setDoor(doorB, hasSerial && !hasBt);
if (hasBt) bleDoorOpened();

/* The update manifest Door A works from — fetched once at load
 * (it also carries the header badges): version, the full image
 * file, the target image's validation hash, and the patch
 * table keyed by base-image validation hash (v4.5). */
let bleMeta = null;
fetch("ble.json").then(r => r.json()).then(meta => {
  bleMeta = meta;
  if (meta && meta.version) {
    document.getElementById("verA").textContent = "— v" + meta.version;
    document.getElementById("verTitle").textContent = "v" + meta.version;
    document.title = "VBALL — Update v" + meta.version;
  }
}).catch(() => { /* header line just stays generic */ });

/* Door B's badge, from the same manifest.json the installer uses. */
fetch("manifest.json").then(r => r.json()).then(mani => {
  if (mani && mani.version) {
    document.getElementById("verB").textContent = "— v" + mani.version;
  }
}).catch(() => { /* badge just stays blank */ });

/* ==== Door A: Bluetooth update — ONE button (v4.5) ===================
 * Tap Update and the whole flow runs: pick VBALL, connect (the
 * phone asks for the 6-digit code on the face — unchanged),
 * read the ball's version + running-image digest from INFO,
 * then send either the PATCH ble.json's table keys to that
 * digest or the full image, and confirm. If the connection
 * drops mid-send the flow reconnects ONCE and starts the
 * transfer over — the ball discards partial transfers on
 * disconnect, so there is no resume; the status line says
 * "starting over" when that happens.
 *
 * v4.5.3 — the connect fix. The 4.5 rewrite had quietly
 * removed the old page's failure manners: disconnects during
 * the flow were swallowed whole and no awaited step had a
 * timeout, so any transient (a window that closed before the
 * connection landed, a pairing that never started) parked
 * the page on "Connecting…" forever. Now: every awaited step
 * is bounded and its timeout names the step and the remedy,
 * disconnects are reported the moment they happen, and the
 * one automatic retry covers the connect phase too.
 *
 * GATT map — must match app/pet_ota.c / BLE-NOTES.md. */
const SVC_UUID    = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c01";
const INFO_UUID   = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c02";
const CTRL_UUID   = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c03";
const DATA_UUID   = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c04";
const STATUS_UUID = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c05";
const TIME_UUID   = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c06";
/* LABRES (v4.3): read-back of the LAB results blob. Protocol:
 * write 5 bytes [0x01][u32 LE offset] to set a cursor, then read:
 * [u32 LE total][u32 LE offset][up to 200 data bytes]. Loop until
 * the whole blob is held. Serves ONLY the lab results — there is
 * no filename and no other file reachable through it. Reading is
 * deliberately NOT version-gated. */
const LABRES_UUID = "a7e51c00-9b4d-4e8a-b3c2-1f0a9d8e7c07";
const META_URL = "ble.json";

/* CTRL opcodes (pet_ota.c): 1 = START (full image), 2 = FINISH,
 * 3 = ABORT, 4 = START_PATCH (v4.5: size = patch bytes, sha =
 * the digest the PRODUCED image must carry). */
const CTRL_START = 1, CTRL_FINISH = 2, CTRL_START_PATCH = 4;

/* Adaptive DATA chunk sizes: start at the big one, step down on
 * error, remember what worked. 509 = MTU 512 minus ATT overhead. */
const CHUNK_SIZES = [509, 244, 128, 20];

const $ = id => document.getElementById(id);
const statusEl = $("status"), noteEl = $("note"), fillEl = $("fill");
const updateBtn = $("updateBtn");
const labBtn = $("labBtn"), labOut = $("labOut"), labDl = $("labDl");

let device = null, server = null, svcSvc = null;
let chInfo = null, chCtrl = null, chData = null, chStatus = null;
let curVersion = null, curDigest = null;   /* from INFO (proto 2) */
let flowing = false, sending = false, finishConfirmed = false;

function say(t, cls) { statusEl.textContent = t; statusEl.className = "big " + (cls || ""); }
function note(t, cls) { noteEl.textContent = t; noteEl.className = cls || "warn"; }
function progress(sent, total, label) {
  const pct = total ? Math.floor(sent * 100 / total) : 0;
  fillEl.style.width = pct + "%";
  say(label + " " + pct + "%");
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Bounded steps (v4.5.3). Every await in the update flow races
 * a clock; a step that outlives its budget fails as a
 * StepTimeout whose remedy text tells Tyler exactly what to
 * do. The device picker is the one exemption — it is
 * user-driven and may sit open as long as he likes. */
const T_CONNECT_MS = 15000;  /* gatt.connect: generous for a sleepy radio */
const T_STEP_MS    = 10000;  /* discovery / setup / control writes */
const T_INFO_MS    = 20000;  /* the encrypted INFO read: pairing lives here */
const T_FETCH_MS   = 30000;  /* payload + manifest downloads */
const WINDOW_GONE =
  "Re-arm the ball (UPDATE tile → YES) and tap Update here right " +
  "away — the ball's countdown on the face is the window you have.";
const NET_GONE =
  "Check this phone's internet connection and tap Update again. " +
  "If the ball's face has gone back to the pet meanwhile, re-arm " +
  "the window on the ball first.";
class StepTimeout extends Error {
  constructor(step, remedy) {
    super(step + " timed out");
    this.step = step;
    this.remedy = remedy;
  }
}
function bounded(promise, ms, step, remedy) {
  let timer = null;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new StepTimeout(step, remedy)), ms);
  });
  return Promise.race([promise, timeout])
    .finally(() => clearTimeout(timer));
}

/* Version grammar mirrors the firmware's (pet_ble_proto.c):
 * MAJOR.MINOR[.PATCH], digits only. Returns null when unparseable. */
function parseVer(s) {
  if (typeof s !== "string" || !/^\d+\.\d+(\.\d+)?$/.test(s)) return null;
  const p = s.split(".").map(Number);
  if (p.some(v => v > 9999)) return null;
  return [p[0], p[1], p.length > 2 ? p[2] : 0];
}
function verCmp(a, b) {
  for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; }
  return 0;
}
function bytesToHex(u8) {
  let s = "";
  for (const b of u8) s += b.toString(16).padStart(2, "0");
  return s;
}
function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return out;
}

/* The no-Web-Bluetooth message belongs to Door A and only shows
 * when that door is actually opened on such a browser. */
function bleDoorOpened() {
  if (bleDoorSeen) return;
  bleDoorSeen = true;
  if (!navigator.bluetooth) {
    say("This browser has no Web Bluetooth.", "bad");
    note("Use Chrome on an Android phone (or Chrome/Edge on a computer " +
         "with Bluetooth). Safari and Firefox phones can't do this — " +
         "the cable installer still works.");
    updateBtn.disabled = true;
  }
}

function onStatusNotify(ev) {
  const v = ev.target.value;
  const st = v.getUint8(0), err = v.getUint8(1), recv = v.getUint32(4, true);
  if (st === 2) { finishConfirmed = true; }
  if (st === 3 && sending) {
    note("The ball refused the update (error " + err +
         ", received " + recv + " bytes). It is still running " +
         "its old version.");
  }
}

function onDisconnected() {
  /* v4.5.3: a disconnect is NEWS again. The 4.5 version of
   * this handler returned in silence while the flow was
   * running, leaving "Connecting…" on screen over a dead
   * link — the idle Tyler reported. The flow's retry still
   * owns recovery, but the drop is said out loud the moment
   * it happens; the flow prints the next word itself. */
  const wasDone = finishConfirmed;
  const wasSending = sending && !finishConfirmed;
  server = null;
  svcSvc = null;
  chInfo = chCtrl = chData = chStatus = null;
  sending = false;
  if (wasDone) {
    say("Done — ball is restarting", "ok");
  } else if (wasSending) {
    say("Connection dropped mid-send.", "bad");
    if (!flowing) {
      note("Nothing was changed on the ball. Re-arm the window " +
           "and tap Update to try again — transfers always " +
           "restart from the beginning.");
    }
  } else {
    say("Connection dropped.", "bad");
  }
  if (!flowing) {
    labBtn.disabled = true;
    updateBtn.disabled = false;
  }
}

/* One connect: picker only when we hold no device yet — a
 * reconnect reuses the BluetoothDevice (no second picker, no
 * second gesture needed). Reads INFO (version + digest) and
 * syncs the clock, as before. */
async function connectOnce() {
  if (!device) {
    say("Pick “VBALL” in the list…");
    device = await navigator.bluetooth.requestDevice({
      /* No filters: Chrome's filtered picker kept hiding VBALL even
       * though Chrome's own scanner sees him (name + RSSI proven on
       * the bluetooth-internals page, 2026-10-28) — the service
       * UUID was not being surfaced to the filter after the old
       * pairing record was forgotten. acceptAllDevices lists every
       * nearby BLE device; Tyler picks VBALL by name. The service
       * is declared optional so GATT access is granted after. */
      acceptAllDevices: true,
      optionalServices: [SVC_UUID]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);
  }
  say("Connecting… your phone may ask for the 6-digit code on the face.");
  server = await bounded(device.gatt.connect(), T_CONNECT_MS,
    "Connecting to the ball",
    "The connection never landed — the ball's window may have " +
    "closed before it. " + WINDOW_GONE);
  const svc = await bounded(server.getPrimaryService(SVC_UUID),
    T_STEP_MS, "Finding the update service",
    "The ball answered but its update service didn't. " +
    WINDOW_GONE);
  svcSvc = svc;
  chInfo = await bounded(svc.getCharacteristic(INFO_UUID),
    T_STEP_MS, "Setting up the update channel", WINDOW_GONE);
  chCtrl = await bounded(svc.getCharacteristic(CTRL_UUID),
    T_STEP_MS, "Setting up the update channel", WINDOW_GONE);
  chData = await bounded(svc.getCharacteristic(DATA_UUID),
    T_STEP_MS, "Setting up the update channel", WINDOW_GONE);
  chStatus = await bounded(svc.getCharacteristic(STATUS_UUID),
    T_STEP_MS, "Setting up the update channel", WINDOW_GONE);
  await bounded(chStatus.startNotifications(),
    T_STEP_MS, "Setting up the update channel", WINDOW_GONE);
  chStatus.addEventListener("characteristicvaluechanged", onStatusNotify);

  /* INFO: proto 1 = [0]=proto [1]=verlen [2..]=version, u16 LE
   * max chunk. Proto 2 (v4.5) appends the running image's
   * 32-byte validation hash after the chunk field — the key
   * into ble.json's patch table. An all-zero digest (the ball
   * could not compute it) means "no patch for me": full image.
   * This read is the first encrypted access: pairing (the
   * phone asking for the face code) happens inside it, so it
   * gets the longest budget and its own status line. */
  say("Pairing… if your phone asks, type the 6-digit code on the face.");
  const info = await bounded(chInfo.readValue(), T_INFO_MS,
    "Pairing with the ball",
    "Pairing never completed. If this phone is holding an old " +
    "pairing for VBALL, clear it (Bluetooth settings → VBALL → " +
    "Forget), then re-arm the ball and tap Update right away. " +
    "The ball forgets its side every window on purpose — the " +
    "face code IS the pairing.");
  const vl = info.getUint8(1);
  let ver = "";
  for (let i = 0; i < vl; i++) ver += String.fromCharCode(info.getUint8(2 + i));
  curVersion = ver;
  curDigest = null;
  if (info.getUint8(0) >= 2 && info.byteLength >= 4 + vl + 32) {
    const dg = new Uint8Array(info.buffer, info.byteOffset + 4 + vl, 32);
    if (dg.some(b => b !== 0)) curDigest = bytesToHex(dg);
  }

  /* Clock sync (v1.9+): the phone is the clock. Send the current
   * UTC epoch + this phone's tz offset to the TIME characteristic;
   * older firmware simply doesn't have it, so failure is silent. */
  try {
    const chTime = await bounded(svc.getCharacteristic(TIME_UUID),
                                 T_STEP_MS, "Clock sync", "");
    const frame = new DataView(new ArrayBuffer(6));
    frame.setUint32(0, Math.floor(Date.now() / 1000), true);
    frame.setInt16(4, -new Date().getTimezoneOffset(), true);
    await bounded(chTime.writeValueWithResponse(frame),
                  T_STEP_MS, "Clock sync", "");
  } catch (e) { /* no TIME characteristic on this firmware */ }
}

/* Pick what to send: the patch when ble.json's table keys the
 * ball's exact running-image digest, the full image otherwise.
 * Returns {bytes, sha, op, label} — for a patch, sha is the
 * TARGET image's validation hash from the table (the digest
 * the produced image must carry); for the full image it is
 * the whole-file SHA-256, computed here as before. */
async function pickPayload() {
  /* v4.5.3: this download used to ride under the stale
   * "Connecting…" text — a slow fetch looked exactly like a
   * dead connection. It has its own status and its own clock. */
  say("Getting the update…");
  if (!bleMeta) {
    const metaResp = await bounded(fetch(META_URL), T_FETCH_MS,
      "Loading the update list", NET_GONE);
    bleMeta = await metaResp.json();
  }
  const entry = curDigest && bleMeta.patches
    ? bleMeta.patches[curDigest] : null;
  if (entry && entry.file && entry.sha256) {
    const resp = await bounded(fetch(entry.file), T_FETCH_MS,
      "Getting the update file", NET_GONE);
    if (resp.ok) {
      const buf = await bounded(resp.arrayBuffer(), T_FETCH_MS,
        "Getting the update file", NET_GONE);
      return { bytes: new Uint8Array(buf),
               sha: hexToBytes(entry.sha256),
               op: CTRL_START_PATCH, label: "Sending patch…" };
    }
    /* A listed patch that will not load must never strand the
     * update: fall through to the full image. */
  }
  const resp = await bounded(fetch(bleMeta.file), T_FETCH_MS,
    "Getting the update file", NET_GONE);
  if (!resp.ok) throw new Error("could not fetch " + bleMeta.file);
  const buf = await bounded(resp.arrayBuffer(), T_FETCH_MS,
    "Getting the update file", NET_GONE);
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return { bytes: new Uint8Array(buf),
           sha: new Uint8Array(digest),
           op: CTRL_START, label: "Sending update…" };
}

/* START → stream → FINISH → confirm, for one picked payload. */
async function sendOnce(payload) {
  sending = true; finishConfirmed = false;
  let chunkIdx = 0;
  const vb = new TextEncoder().encode(bleMeta.version);
  const start = new Uint8Array(38 + vb.length);
  start[0] = payload.op;
  new DataView(start.buffer).setUint32(1, payload.bytes.length, true);
  start.set(payload.sha, 5);
  start[37] = vb.length;
  start.set(vb, 38);
  say(payload.op === CTRL_START_PATCH ? "Starting patch…" : "Starting…");
  await bounded(chCtrl.writeValueWithResponse(start), T_STEP_MS,
    "Starting the transfer",
    "The ball didn't answer the start command. " + WINDOW_GONE);

  const bytes = payload.bytes;
  let off = 0;
  while (off < bytes.length) {
    const n = Math.min(CHUNK_SIZES[chunkIdx], bytes.length - off);
    try {
      await chData.writeValueWithResponse(bytes.subarray(off, off + n));
      off += n;
      progress(off, bytes.length, payload.label);
    } catch (e) {
      if (chunkIdx < CHUNK_SIZES.length - 1 && server) {
        chunkIdx++;   /* step down and retry the same bytes */
        continue;
      }
      throw e;
    }
  }

  say("Ball is checking it…");
  await bounded(chCtrl.writeValueWithResponse(
    new Uint8Array([CTRL_FINISH])), T_STEP_MS,
    "Finishing the transfer",
    "The ball didn't answer the finish command. It is unchanged " +
    "if the check never ran — re-arm it and tap Update to retry.");
  /* The ball confirms over STATUS (and then reboots itself). */
  try {
    const st = await bounded(chStatus.readValue(), T_STEP_MS,
                             "Reading the result", "");
    if (st.getUint8(0) === 2) finishConfirmed = true;
    if (st.getUint8(0) === 3) throw new Error("ball reported failure");
  } catch (e) {
    if (finishConfirmed) { /* reboot disconnect raced the read */ }
    else if (e && e.message === "ball reported failure") throw e;
  }
  sending = false;
}

updateBtn.addEventListener("click", async () => {
  if (flowing) return;
  flowing = true;
  updateBtn.disabled = true;
  labBtn.disabled = true;
  note("");
  fillEl.style.width = "0%";
  let connectedOnce = false;
  try {
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        await connectOnce();
        connectedOnce = true;
        if (!bleMeta) {
          const metaResp = await bounded(fetch(META_URL),
            T_FETCH_MS, "Loading the update list", NET_GONE);
          bleMeta = await metaResp.json();
        }
        /* LAB read-back rides any live connection — enabled
         * here, before the version gate, exactly as before:
         * reading results is not an update. */
        labBtn.disabled = false;
        const a = parseVer(bleMeta.version), b = parseVer(curVersion);
        if (!a || !b || verCmp(a, b) <= 0) {
          say("Already up to date.", "ok");
          $("versions").textContent =
            "Ball is running " + curVersion + " · this page offers " +
            bleMeta.version + ".";
          flowing = false;
          updateBtn.disabled = false;
          return;
        }
        const payload = await pickPayload();
        $("versions").textContent =
          "Ball is running " + curVersion + " · updating to " +
          bleMeta.version + (payload.op === CTRL_START_PATCH
            ? " (patch, " + payload.bytes.length + " bytes)"
            : " (full update, " + payload.bytes.length + " bytes)") + ".";
        await sendOnce(payload);
        say("Done — ball is restarting", "ok");
        fillEl.style.width = "100%";
        flowing = false;
        return;
      } catch (e) {
        if (attempt === 1 && device) {
          /* ONE automatic retry, from the beginning — v4.5.3:
           * it now covers the CONNECT phase too. In 4.5 the
           * retry required a completed connect first, so the
           * exact failures Tyler hit (a connect that never
           * landed, a pairing that never started) were the
           * ones it could not help. The ball discards a partial
           * transfer when the link drops, so the stream
           * restarts — there is no resume. (No device yet =
           * the picker was cancelled: that needs a fresh tap,
           * not a retry — a picker cannot open without one.) */
          sending = false;
          try {
            if (device.gatt && device.gatt.connected) {
              device.gatt.disconnect();
            }
          } catch (ignored) { /* already gone */ }
          server = null; svcSvc = null;
          say("That didn't land — trying once more…");
          note(e instanceof StepTimeout
            ? e.step + " timed out; giving it one more try."
            : "The transfer starts over from the beginning.");
          await sleep(900);
          continue;
        }
        throw e;
      }
    }
  } catch (e) {
    sending = false;
    if (e instanceof StepTimeout) {
      say(e.step + " timed out.", "bad");
      note(e.remedy);
    } else if (!device) {
      say("No device picked.");
      note("If VBALL wasn't listed: is the face showing an update " +
           "code and a countdown? Arm the window on the ball " +
           "first, then tap Update right away.");
    } else {
      say("Update failed.", "bad");
      note("The ball is unchanged and still on its old version. " +
           "Tap Update to try again. (" +
           (e && e.message ? e.message : e) + ")");
    }
  }
  flowing = false;
  updateBtn.disabled = false;
  if (server) labBtn.disabled = false;
});

/* ==== LAB results read-back (v4.3) ===================================
 * Chunked pull of the one blob the LABRES characteristic serves.
 * See LABRES_UUID for the protocol. Any failure is reported in the
 * results box; nothing here touches the update path. */
labBtn.addEventListener("click", async () => {
  if (!svcSvc) return;
  labBtn.disabled = true;
  labOut.hidden = false;
  labOut.textContent = "Reading LAB results…";
  try {
    const ch = await svcSvc.getCharacteristic(LABRES_UUID);
    const chunks = [];
    let total = -1, off = 0, guard = 0;
    while (total < 0 || off < total) {
      if (++guard > 600) throw new Error("read-back made no progress");
      const req = new Uint8Array(5);
      req[0] = 1;
      new DataView(req.buffer).setUint32(1, off, true);
      await ch.writeValueWithResponse(req);
      const v = await ch.readValue();
      if (v.byteLength < 8) throw new Error("short read-back header");
      const t = v.getUint32(0, true), o = v.getUint32(4, true);
      if (total < 0) {
        total = t;
        if (total === 0) {
          labOut.textContent =
            "No LAB results on the charm yet — run LAB TESTS first " +
            "(app page → LAB TESTS), then read again.";
          labBtn.disabled = false;
          return;
        }
      }
      if (o !== off) throw new Error("read-back offset mismatch");
      const n = v.byteLength - 8;
      if (n > 0) {
        chunks.push(new Uint8Array(v.buffer, v.byteOffset + 8, n));
        off += n;
      } else if (off < total) {
        throw new Error("read-back stalled at " + off + " of " + total);
      }
      labOut.textContent = "Reading LAB results… " + off + " / " + total;
    }
    const blob = new Uint8Array(total);
    let p = 0;
    for (const c of chunks) { blob.set(c, p); p += c.length; }
    const text = new TextDecoder().decode(blob);
    labOut.textContent = text;
    const url = URL.createObjectURL(
      new Blob([text], { type: "text/plain" }));
    labDl.href = url;
    labDl.style.display = "inline";
    note("LAB results pulled from the charm — copy them from the box " +
         "above, or use the download link.", "ok");
  } catch (e) {
    labOut.textContent =
      "Could not read LAB results: " +
      (e && e.message ? e.message : e) +
      "\n(The charm needs the v4.4 LAB build for this — older " +
      "firmware has no results to serve.)";
  }
  labBtn.disabled = false;
});
</script>
