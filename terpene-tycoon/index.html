<script>
/* Terpene Tycoon -- Pages-only save shim (single local slot).
 * This file is included ONLY in the GitHub Pages build. The widget build
 * persists via the hatch bridge instead, and the widget validator rejects
 * localStorage outright. The game calls window.hatchWidget only when the
 * bridge is absent, so this never activates inside the widget. */
(function(){
"use strict";
if(window.hatchWidget)return;
var KEY="terpene-tycoon.pages.save.v1";
function ls(){try{return window.localStorage||null;}catch(e){return null;}}
window.hatchWidget={
 getState:function(def){
  var s=ls(),raw=null;
  if(s){try{raw=s.getItem(KEY);}catch(e){}}
  if(raw){try{var o=JSON.parse(raw);if(o&&typeof o==="object"&&!Array.isArray(o))return o;}catch(e){}}
  var d=JSON.parse(JSON.stringify(def));
  if(s){try{s.setItem(KEY,JSON.stringify(d));}catch(e){}}
  return d;
 },
 setState:function(st){
  var s=ls();if(!s)return;
  try{s.setItem(KEY,JSON.stringify(st));}catch(e){/* quota/private mode: ignore */}
 }
};
})();
</script>

<style>
.pg{box-sizing:border-box;width:100%;max-width:1280px;margin:0 auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--hatch-widget-text)}
.pg *{box-sizing:border-box}
/* ===== TERPENE TYCOON v16: noir dark theme (self-contained) =====
   The game owns its theme variables on .pg, so dark mode renders correctly
   no matter what the host page provides (never bright white). The light
   theme overrides below win by specificity. */
.pg{
 --hatch-widget-bg:#0a0a0c;
 --hatch-widget-surface:#141417;
 --hatch-widget-surface-muted:#0e0e11;
 --hatch-widget-text:#ece9e2;
 --hatch-widget-muted:#8f8f99;
 --hatch-widget-border:#2b2b32;
 --hatch-widget-accent:#e5484d;
 --hatch-widget-on-accent:#ffffff;
 --hatch-widget-focus:#e5484d;
 --hatch-widget-shadow:rgba(0,0,0,.6);
 background:radial-gradient(620px 260px at 50% -80px,rgba(229,72,77,.06),transparent 60%),radial-gradient(900px 480px at 50% 115%,rgba(0,0,0,.55),transparent 62%),#0a0a0c;
}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pg-title{font-weight:900;font-size:19px;letter-spacing:2.5px;color:#f2efe8;text-shadow:0 0 18px rgba(229,72,77,.4),0 1px 2px rgba(0,0,0,.6)}
.pg-sub{display:block;font-size:10px;letter-spacing:4px;color:var(--hatch-widget-muted);font-weight:700}
.pg-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pg [hidden]{display:none!important}
.pill{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.pill.dim{color:var(--hatch-widget-muted);font-weight:600}
.pg-heat{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--hatch-widget-muted)}
.heat-bar{flex:1;height:10px;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);border-radius:99px;overflow:hidden}
.heat-bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f97316);transition:width .4s}
.heat-bar i.hot{background:linear-gradient(90deg,#f97316,#ef4444);animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.v-heattier{min-width:110px;text-align:right;color:#fbbf24}
.pg-msg{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:10px;padding:6px 10px;font-size:12.5px;margin-bottom:8px;min-height:1.4em}
.pg-tabs{display:flex;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);border-radius:12px;padding:3px;gap:4px;margin-bottom:8px}
.pg-tabs button{flex:1;min-width:0;padding:7px 0;border:0;border-radius:8px;background:transparent;color:var(--hatch-widget-muted);font-weight:800;font-size:13px;cursor:pointer}
.pg-tabs button.on{background:var(--hatch-widget-surface);box-shadow:0 1px 4px var(--hatch-widget-shadow)}
.store-tabs{display:flex;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);border-radius:12px;padding:3px;gap:2px;margin-bottom:8px}
.store-tabs button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 0;border:0;border-radius:8px;background:transparent;color:var(--hatch-widget-muted);font-weight:800;font-size:10.5px;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.store-tabs button svg{display:block;flex:0 0 auto;width:11px;height:11px}
.store-tabs button.on{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);box-shadow:0 1px 4px var(--hatch-widget-shadow)}
.store-tabs button.store-back{flex:0 0 auto;padding:7px 8px;font-size:11px;color:var(--hatch-widget-accent)}
.store-banner{display:flex;align-items:baseline;gap:9px;margin:2px 2px 8px;padding:8px 12px;border:1px solid var(--hatch-widget-border);border-left:3px solid var(--sc,#4ade80);border-radius:10px;background:var(--hatch-widget-surface)}
.store-banner b{font-size:15px;letter-spacing:2px;color:var(--sc,#4ade80);white-space:nowrap;display:flex;align-items:center;gap:7px}
.store-banner b svg{display:block;flex:0 0 auto}
@media(max-width:560px){.pg-tabs{gap:2px;padding:2px}.pg-tabs button{font-size:12px}.btns button{min-width:0;overflow:hidden;text-overflow:ellipsis}}
@media(min-width:700px){
 .pane-store{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;align-items:start}
 .pane-store>.store-screen-head,.pane-store>.store-tabs,.pane-store>.store-banner{grid-column:1/-1}
 .pane-deal{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;align-items:start}
 .pane-deal>.dchips{grid-column:1/-1}
}
/* ===== TERPENE TYCOON v17: fill each device's screen, finger-friendly ===== */
@media(min-width:700px){
 .pg{padding:16px 18px 12px}
 .pots{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
 .plant{height:120px}
 .pg-msg{font-size:14px}
 .pill{font-size:13px}
}
@media(min-width:1100px){
 .pane-store{grid-template-columns:1fr 1fr 1fr}
 .pane-deal{grid-template-columns:1fr 1fr 1fr}
 .pots{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
 .pg-tabs button{font-size:14px;padding:10px 0}
 .pg-title{font-size:23px}
}
/* finger-sized touch targets on touch devices */
@media(pointer:coarse){
 .pg-tabs button{padding:14px 0;font-size:13px;min-height:54px;overflow:hidden;text-overflow:ellipsis}
 .growbar button{padding:13px 14px;font-size:14px;min-height:50px}
 .btns button{padding:12px 8px;font-size:13.5px;min-height:46px}
 .dchip{padding:10px 8px;min-height:46px;font-size:12.5px}
 .store-tabs button{padding:11px 0;min-height:46px;font-size:12px}
 .pc-btns button{min-height:42px}
 .srow button{padding:12px 16px;min-height:46px}
 .spd{padding:10px 6px;min-height:46px}
 .acc-h{padding:12px 10px !important;min-height:48px}
 .tapbtn{padding:18px;min-height:58px}
 .amtrow button{min-height:44px;min-width:44px}
}
.store-banner span{font-size:11.5px;color:var(--hatch-widget-muted)}
.store-screen-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.store-screen-head .store-back{display:flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--hatch-widget-border);color:var(--hatch-widget-accent);border-radius:8px;padding:6px 10px;font-weight:800;font-size:11px;letter-spacing:1px;cursor:pointer}
.store-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:2px;color:var(--hatch-widget-accent)}
.pg-pane[hidden]{display:none}
.pg-hint{font-size:11.5px;color:var(--hatch-widget-muted);margin-top:8px;line-height:1.5}
.prop{margin-bottom:10px}
.prop-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prop-name{font-weight:900;font-size:14px;letter-spacing:.5px}
.prop-tier{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#ece9e2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 10px}
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pot{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:12px;padding:8px}
.plant{position:relative;width:100%;height:100px;overflow:hidden}
.sway{position:absolute;inset:0;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.2deg)}}
.stem{position:absolute;bottom:14px;left:50%;width:5px;margin-left:-2.5px;background:linear-gradient(180deg,#4cc36a,#2a7f38);border-radius:3px}
.lf{position:absolute;height:13px;background:linear-gradient(90deg,#4cc36a,#2c8a3c);border-radius:90% 8% 90% 8%}
.lf.r{left:50%;transform-origin:0 50%}
.lf.l{right:50%;transform-origin:100% 50%}
.bud{position:absolute;width:11px;height:14px;margin-left:-5px;border-radius:50%;animation:budp 1.8s ease-in-out infinite}
@keyframes budp{50%{transform:scale(1.12)}}
.wilt .sway{animation:none;transform:rotate(7deg);filter:saturate(.55) brightness(.92)}
.p-pot{width:66px;height:38px;margin:-8px auto 0;background:linear-gradient(180deg,#c06a28,#8a4a14);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);border-radius:0 0 6px 6px;position:relative;z-index:2}
.p-empty{text-align:center;padding:6px 0}

.p-stage{font-size:10px;font-weight:700;color:var(--hatch-widget-muted);letter-spacing:1px;text-transform:uppercase}
.brow{display:flex;align-items:center;gap:6px;font-size:10.5px;margin:3px 0}
.brow span{width:44px;color:var(--hatch-widget-muted);font-weight:700}
.brow b{min-width:26px;width:auto;white-space:nowrap;text-align:right;font-size:10.5px}
.bar{flex:1;min-width:0;height:7px;background:var(--hatch-widget-surface-muted);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

function dealerStreakHeat(di){
 // Punish hitting the same dealer repeatedly: streak 4+ adds escalating heat
 if(di===S.lastDealer){S.dealerStreak=(S.dealerStreak||0)+1;}else{S.lastDealer=di;S.dealerStreak=1;}
 if(S.dealerStreak>=4){
  var extra=(S.dealerStreak-3)*5;
  S.heat=Math.min(100,S.heat+extra);
  if(S.dealerStreak===4)showRoachWarn();
  return extra;
 }
 return 0;
}

function tickerHints(){
 var L=pLevel(),econ=[],info=[],status=[];
 var di=DUFFEL.indexOf(S.stashCap);
 // ECONOMIC — most money-relevant first
 for(var _lt=Math.max(1,L-1);_lt<=L;_lt++){
  (LEVEL_TIPS[_lt]||[]).forEach(function(t){econ.push(t);});
 }
 var jtot=GROWKEYS.reduce(function(a,k){return a+(S.joints[k]||0);},0);
 if(jtot>0)econ.push("Smoke a joint: -4 heat and better sell prices for 5 min");
 econ.push("Deal prices drift — buy low, sell high");
 if(di<DUFFEL.length-1)econ.push("Duffel cramped? Upgrade at the Supply Depot — carry up to "+DUFFEL[DUFFEL.length-1]+"g");
 var hasW=S.weapons&&Object.keys(S.weapons).some(function(w){return S.weapons[w];});
 if(!hasW&&L>=2)econ.push("No weapon yet — hit the Gun Store before the cops jump you");
 if(S.props.length<2&&L>=2)econ.push("Trap House: 6 grow slots — see Green Realty");
 if(L>=3){
  var hasKit=S.kits&&Object.keys(S.kits).some(function(k){return (S.kits[k]||0)>0;});
  if(!hasKit)econ.push("No lab kits — stock up at Lab Supply to start cooking");
 }
 if((S.fert||0)<=0)econ.push("Out of fertilizer — Supply Depot sells instant +30 growth");
 // INFO
 if(L<8&&UNLOCKS[L+1])info.push("Level "+(L+1)+" unlocks: "+UNLOCKS[L+1].join(", "));
 info.push("Stash tab: roll, smoke or sell every bag in one place");
 // STATUS — last
 var thirsty=false;
 S.props.forEach(function(pr){pr.slots.forEach(function(p){if(p&&p.water<20)thirsty=true;});});
 if(thirsty)status.push("Plants are thirsty — hit Water All");
 if(stashTotal()>=S.stashCap*0.9)status.push("Duffel almost full — sell or upgrade before your next harvest");
 if(S.heat>=70)status.push("Heat critical — bribe the cops or smoke to cool down");
 else if(S.heat>=40)status.push("Heat rising — keep it cool");
 if(S.job)status.push("Lab job cooking — check the Cook tab");
 return econ.concat(info,status);
}
var tickerState={x:0,last:0,pausedUntil:0,count:0,fast:false};

function tickerSpeed(){return tickerState.fast?34:18;}
function tickerTick(){
 var track=q(".ticker-track");
 if(!track||!track.children.length)return;
 var now=Date.now();
 if(!tickerState.last)tickerState.last=now;
 var dt=Math.min(0.5,(now-tickerState.last)/1000);
 tickerState.last=now;
 if(now<tickerState.pausedUntil)return;
 var half=track.scrollWidth/2;
 if(half<=0)return;
 tickerState.x+=dt*tickerSpeed();
 if(tickerState.x>=half)tickerState.x-=half;
 track.style.transform="translateX("+(-tickerState.x)+"px)";
}

function tick(){
 var now=Date.now();
 var dtm=Math.max(0,(now-S.lastTick)/60000);
 S.lastTick=now;
 if(S.buffUntil&&now>S.buffUntil){S.buffMult=1;S.buffUntil=0;}
 if(dtm>0){
  S.props.forEach(function(pr){
   pr.slots.forEach(function(p){
    if(!p)return;
    var wr=100/35,gr=100/growMinOf(p.strain);
    var growTime=p.water>15?Math.min(dtm,(p.water-15)/wr):0;
    p.water=Math.max(0,p.water-dtm*wr);
    if(p.growth<100)p.growth=Math.min(100,p.growth+growTime*gr);
   });
  });
  if(now>=S.driftAt){var _nd=0;while(now>=S.driftAt&&_nd<24){driftDealers();S.driftAt+=4*60000;_nd++;}if(now>=S.driftAt)S.driftAt=now+4*60000;}
  if(S.heat>0){var _hd=dtm*2.5;if(S.buffUntil&&now<S.buffUntil)_hd+=dtm*0.5;S.heat=Math.max(0,S.heat-_hd);}
  if(S.hp<100)S.hp=Math.min(100,S.hp+dtm/2);
 }
 if(S.job){
  if(S.job.phase==="cooking"&&Date.now()>=S.job.readyAt)settleCooking();
  else if(!S.job.phase)settleJob();
 }
 save();render();
}

function markerPos(now){var p=(now/1400)%2;return p<1?p:2-p;}
function cookPull(){
 var j=S.job;if(!j)return;
 var r=RECIPES[j.key];
 if(!(r.game==="timing"||(r.game==="finale"&&j.fin.stage===1)))return;
 var pos=markerPos(Date.now());
 var ok=pos>=0.42&&pos<=0.58;
 if(r.game==="finale"){j.fin.scores.push(ok?1:0.5);j.fin.stage=2;j.mem=newMem(0,Date.now());S.msg=ok?"Perfect pull! Now the sequence.":"Sloppy pull. Now the sequence.";}

function cookFz(){
 var j=S.job;if(!j||RECIPES[j.key].game!=="freezethaw")return;
 var pos=markerPos(Date.now()),ph=j.fz.phase;
 var ok=ph===0?(pos>=0.55&&pos<=0.75):(pos>=0.20&&pos<=0.40);
 j.fz.pass[ph]=ok;
 if(ph===0){j.fz.phase=1;S.msg=ok?"Frozen solid. Now thaw it.":"Weak freeze. Now thaw it.";save();render();}
 else{
  var s=j.fz.pass[0]&&j.fz.pass[1]?1:((j.fz.pass[0]||j.fz.pass[1])?0.75:0.5);
  finishCook(s);

function cookPad(pad){
 var j=S.job;if(!j)return;
 var r=RECIPES[j.key],now=Date.now();
 if(r.game==="target"){
  var t=j.tg;
  if(pad===t.lit)t.hits++;
  t.round++;
  if(t.round>=5){finishCook(0.5+0.5*t.hits/5);return;}
  t.lit=(Math.random()*3)|0;t.litAt=now;
  save();render();return;
 }
 if(r.game==="memory"||(r.game==="finale"&&j.fin.stage===2)){
  var m=j.mem;
  if(m.phase!=="input")return;
  m.input.push(pad);
  var idx=m.input.length-1;
  if(m.input[idx]!==m.seq[idx]){
   if(r.game==="finale"){finStageDone(0.5);return;}
   finishCook(0.5);return;
  }
  if(m.input.length>=m.seq.length){
   if(m.round>=1){
    if(r.game==="finale"){finStageDone(1);return;}
    finishCook(1);return;
   }
   j.mem=newMem(m.round+1,now);
   S.msg="Round 2 — longer sequence.";
  }
  save();render();
 }
}

function pump(){
 if(!S.job)return;
 var j=S.job;
 if(j.phase==="cooking"){
  var rem=Math.max(0,j.readyAt-Date.now()),tot=Math.max(1,j.readyAt-j.cookStart);
  var cc=q(".cook-count");if(cc)cc.textContent=fmtT(Math.ceil(rem/1000));
  var cf=q(".cook-fill");if(cf)cf.style.width=Math.min(100,(tot-rem)/tot*100)+"%";
  if(rem<=0)settleCooking();
  return;
 }
 if(j.phase==="ready")return;
 var r=RECIPES[j.key],now=Date.now();
 if(r.game==="tap"||(r.game==="finale"&&j.fin.stage===0)){
  var tp=j.tp;
  var fill=q(".tap-fill");if(fill)fill.style.width=Math.min(100,tp.have/tp.need*100)+"%";
  var tt=q(".tap-time");if(tt)tt.textContent=Math.max(0,Math.ceil((tp.deadline-now)/1000))+"s left";
  if(now>=tp.deadline){
   if(r.game==="finale"){j.fin.scores.push(tp.have>=tp.need?1:0.5);j.fin.stage=1;S.msg="Time! Now pull.";save();render();}
   else finishCook(tp.have>=tp.need?1:0.5);
  }
  return;
 }
 if(r.game==="timing"||r.game==="freezethaw"||(r.game==="finale"&&j.fin.stage===1)){
  var mk=q(".tm-mark");if(mk)mk.style.left=(markerPos(now)*100)+"%";
  return;
 }
 if(r.game==="target"){
  var t=j.tg;
  qa(".tg-pad").forEach(function(el,i){el.classList.toggle("lit",t.lit===i);});
  if(now-t.litAt>1300){
   t.round++;
   if(t.round>=5){finishCook(0.5+0.5*t.hits/5);return;}
   t.lit=(Math.random()*3)|0;t.litAt=now;
   save();render();
  }
  return;
 }
 if(r.game==="memory"||(r.game==="finale"&&j.fin.stage===2)){
  var m=j.mem,pads=qa(".mm-pad");
  if(m.phase==="show"){
   var idx=Math.floor((now-m.showStart)/500);
   pads.forEach(function(el,i){el.classList.toggle("lit",i===m.seq[idx]);});
   if(now-m.showStart>m.seq.length*500+400){m.phase="input";m.input=[];save();render();}
  }
 }
}
