<script>
/* Terpene Tycoon -- Pages-only save shim (single local slot).
 * This file is included ONLY in the GitHub Pages build. The widget build
 * persists via the hatch bridge instead, and the widget validator rejects
 * localStorage outright. The game calls window.hatchWidget only when the
 * bridge is absent, so this never activates inside the widget. */
(function(){
"use strict";
if(window.hatchWidget)return;
var KEY="terpene-tycoon.pages.save.v1";
function ls(){try{return window.localStorage||null;}catch(e){return null;}}
window.hatchWidget={
 getState:function(def){
  var s=ls(),raw=null;
  if(s){try{raw=s.getItem(KEY);}catch(e){}}
  if(raw){try{var o=JSON.parse(raw);if(o&&typeof o==="object"&&!Array.isArray(o))return o;}catch(e){}}
  var d=JSON.parse(JSON.stringify(def));
  if(s){try{s.setItem(KEY,JSON.stringify(d));}catch(e){}}
  return d;
 },
 setState:function(st){
  var s=ls();if(!s)return;
  try{s.setItem(KEY,JSON.stringify(st));}catch(e){/* quota/private mode: ignore */}
 }
};
})();
</script>

.ts-heat .heat-bar{flex:1}
.ts-heat .heat-bar{height:7px}.ts-heattier{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--hatch-widget-muted);white-space:nowrap}
.ts-msg{font-size:11px;color:var(--hatch-widget-muted);line-height:1.3}
.pg-pane::-webkit-scrollbar{display:none}
.pg-pane[hidden]{display:none}
/* ===== TERPENE TYCOON v16: noir dark theme (self-contained) =====
   The game owns its theme variables on .pg, so dark mode renders correctly
   no matter what the host page provides (never bright white). The light
   theme overrides below win by specificity. */
.pg{
 --hatch-widget-bg:#0a0a0c;
 --hatch-widget-surface:#141417;
 --hatch-widget-surface-muted:#0e0e11;
 --hatch-widget-text:#ece9e2;
 --hatch-widget-muted:#8f8f99;
 --hatch-widget-border:#2b2b32;
 --hatch-widget-accent:#e5484d;
 --hatch-widget-on-accent:#ffffff;
 --hatch-widget-focus:#e5484d;
 --hatch-widget-shadow:rgba(0,0,0,.6);
 background:radial-gradient(620px 260px at 50% -80px,rgba(229,72,77,.06),transparent 60%),radial-gradient(900px 480px at 50% 115%,rgba(0,0,0,.55),transparent 62%),#0a0a0c;
}
.pg-head{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;margin:0 0 6px;padding:6px 12px;background:linear-gradient(180deg,#0d1f14,#0a0a0c);border-bottom:2px solid #16a34a;flex-wrap:wrap;box-sizing:border-box}
.pg-title{font-weight:900;font-size:19px;letter-spacing:2px;color:#4ade80;text-shadow:0 0 4px rgba(74,222,128,.5),0 1px 1px rgba(0,0,0,.8)}
.pg-sub{display:none}
.pg-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pg [hidden]{display:none!important}

.heat-bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f97316);transition:width .4s}
.heat-bar i.hot{background:linear-gradient(90deg,#f97316,#ef4444);animation:blink .7s steps(2) infinite}

.store-tabs button svg{display:block;flex:0 0 auto;width:11px;height:11px}
.store-tabs button.on{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);box-shadow:0 1px 4px var(--hatch-widget-shadow)}

<style>

<style>

.pg{position:relative}
.pg-tabs button{font-size:14.5px;padding:7px 0;letter-spacing:.2px}
.pill.buff{border-color:#fbbf24;color:#fbbf24;font-variant-numeric:tabular-nums;text-shadow:0 0 3px rgba(251,191,36,.5);position:relative;overflow:hidden}.pill.buff .buff-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(251,191,36,.25);width:0%;transition:width .5s linear}.pill.buff .buff-tx{position:relative;z-index:1}
.bufftag{font-size:12px;font-weight:800;color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);border-radius:99px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.srow.locked{opacity:.55}
.lvtag{font-size:12px;font-weight:800;letter-spacing:1px;color:#fbbf24;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.4);border-radius:99px;padding:2px 8px;white-space:nowrap}
.dchip.locked{opacity:.5}

.smoke-fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden;border-radius:16px}

.smoke-fx .wash{position:absolute;inset:0;border-radius:16px;filter:none;animation:washfade 4.2s ease-out forwards}

}

.ticker-track{display:flex;width:max-content;white-space:nowrap;will-change:transform}

 if(!k||PRODUCTS[k].tier>pLevel())return;
 var planted=0;
 for(var pi=0;pi<S.props.length;pi++){
  var pr=S.props[pi];
  for(var si=0;si<pr.slots.length;si++){
   if(!pr.slots[si]&&S.seeds[k]>0){
    S.seeds[k]--;
    trackCost(k,PRODUCTS[k].seed);
    pr.slots[si]={strain:k,growth:0,water:70};
    planted++;
   }
  }
 }
 S.msg=planted>0?("Auto-planted "+planted+" "+PRODUCTS[k].name+"."):(S.seeds[k]<=0?"No "+PRODUCTS[k].name+" seeds left.":"No empty pots.");
 save();render();
}
function doHarvest(pi,si){
 var pr=S.props[pi],p=pr&&pr.slots[si];
 if(!p||p.growth<100)return;
 var y=PRODUCTS[p.strain].yld;
 var grams=Math.round((y[0]+Math.random()*(y[1]-y[0]))*(0.6+0.4*p.water/100));
 var take=Math.min(grams,S.stashCap-stashTotal());
 if(take<=0){S.msg="Duffel is full — sell some or upgrade it.";save();render();showBagFullWarn();return;}
 S.stash[p.strain]+=take;
 pr.slots[si]=null;
 S.stats.harvested++;
 var _hx=addXP(8*PRODUCTS[p.strain].tier);
 if(!_hx)S.msg="Harvested "+take+"g of "+PRODUCTS[p.strain].name+".";
 save();render();
}
function doHarvestAll(){
 var hn=0,ht=0,full=false,lv0=pLevel();
 S.props.forEach(function(pr){pr.slots.forEach(function(p,si){
  if(!p||p.growth<100)return;
  var y=PRODUCTS[p.strain].yld;
  var grams=Math.round((y[0]+Math.random()*(y[1]-y[0]))*(0.6+0.4*p.water/100));
  var take=Math.min(grams,S.stashCap-stashTotal());
  if(take<=0){full=true;return;}
  S.stash[p.strain]+=take;pr.slots[si]=null;S.stats.harvested++;ht+=take;hn++;
  addXP(8*PRODUCTS[p.strain].tier);
 });});
 var lv1=pLevel();
 if(hn===0){S.msg=full?"Duffel is full — sell some or upgrade it.":"Nothing ready to harvest yet.";if(full)showBagFullWarn();}
 else{S.msg="Harvested "+ht+"g from "+hn+" plant"+(hn>1?"s":"")+".";if(full)S.msg+=" Duffel is full — sell some or upgrade it.";if(lv1>lv0)S.msg+=" Reached level "+lv1+"!";}
 save();render();
}
function doBust(){
 PKEYS.forEach(function(k){S.stash[k]=0;});
 GROWKEYS.forEach(function(k){S.joints[k]=0;});
 S.heat=45;S.lockedUntil=Date.now()+5*60000;S.stats.busted++;
 S.msg="BUSTED! Cops seized your whole stash. Lay low for 5 minutes.";
}
function trackCost(k,amount){S.invested[k]=Math.round(((S.invested[k]||0)+amount)*100)/100;}
function calcProfit(k,soldQty,heldBefore,revenue){
 var inv=S.invested[k]||0;
 var costPortion=heldBefore>0?inv*(soldQty/heldBefore):0;
 var profit=Math.round(revenue-costPortion);
 // Reduce invested by the portion sold
 S.invested[k]=Math.max(0,Math.round((inv-costPortion)*100)/100);
 return profit;
}

function dealerStreakHeat(di){
 // Punish hitting the same dealer repeatedly: streak 4+ adds escalating heat
 if(di===S.lastDealer){S.dealerStreak=(S.dealerStreak||0)+1;}else{S.lastDealer=di;S.dealerStreak=1;}
 if(S.dealerStreak>=4){
  var extra=(S.dealerStreak-3)*5;
  S.heat=Math.min(100,S.heat+Math.ceil(extra*0.5));
  if(S.dealerStreak===4)showRoachWarn();
  return extra;
 }
 return 0;
}
function doDeal(di,k,isBuy,isJoint){
 var now=Date.now();
 if(now<S.lockedUntil)return;
 var d=S.dealers[di],g=S.amt,st=PRODUCTS[k];
 if(isBuy){
  var unit=ppu(st.price,d.sell[k]),cost=Math.ceil(unit*g);
  if(S.cash<cost){S.msg="Not enough cash for that.";save();render();return;}
  if(stashTotal()+g>S.stashCap){S.msg="Duffel is full — sell some or upgrade it.";save();render();showBagFullWarn();return;}
  S.cash-=cost;S.stash[k]+=g;trackCost(k,cost);S.heat=Math.min(100,S.heat+heatGain(2+g));
  var dh=dealerStreakHeat(di);
  if(!addXP(5))S.msg="Bought "+g+"g of "+st.name+" for "+money(cost)+"."+(dh>0?" Same spot too many times — heat +"+dh+".":"");
 }else{
  var have=isJoint?(S.joints[k]||0):S.stash[k];
  if(have<g){S.msg="You don't have "+g+(isJoint?" joints":"g")+" of "+st.name+".";save();render();return;}
  var unit2=ppu(st.price,d.buy[k]);
  if(isJoint)unit2=Math.round(unit2*0.9);
  if(buffActive())unit2=Math.round(unit2*S.buffMult);
  var rev=Math.floor(unit2*g);
  var heldBefore=isJoint?(S.joints[k]||0):(S.stash[k]||0);
  if(isJoint)S.joints[k]-=g;else S.stash[k]-=g;
  S.cash+=rev;S.stats.earned+=rev;S.stats.deals++;
  S.heat=Math.min(100,S.heat+heatGain(2+g));
  var dh2=dealerStreakHeat(di);
  var prof=calcProfit(k+(isJoint?"_j":""),g,heldBefore,rev);
  if(!addXP(5))S.msg="Sold "+g+(isJoint?" joints":"g")+" of "+st.name+" to "+d.name+" for "+money(rev)+"."+(dh2>0?" Same spot too many times — heat +"+dh2+".":"");
  showSalePop(st.name,g+(isJoint?" joints":"g"),rev,prof);
 }
 battleRoll();
 save();render();
}

function stashDealer(){
 var di=S.dealer||0;if(di>=S.dealers.length)di=0;
 while(di>0&&DEALER_TIER[di]>pLevel())di--;
 return {d:S.dealers[di],di:di};
}
function doStashSellAll(k,isJoint){
 var now=Date.now();
 if(now<S.lockedUntil)return;
 var sd=stashDealer(),d=sd.d;
 var have=isJoint?(S.joints[k]||0):(S.stash[k]||0);
 if(have<1){S.msg="Nothing to sell.";save();render();return;}
 var st=PRODUCTS[k];
 var unit=ppu(st.price,d.buy[k]);
 if(isJoint)unit=Math.round(unit*0.9);
 if(buffActive())unit=Math.round(unit*S.buffMult);
 var rev=Math.floor(unit*have);
 if(isJoint)S.joints[k]=0;else S.stash[k]=0;
 S.cash+=rev;S.stats.earned+=rev;S.stats.deals++;
 S.heat=Math.min(100,S.heat+Math.ceil((2+have)*0.5));
 var dh3=dealerStreakHeat(sd.di);
 var prof2=calcProfit(k+(isJoint?"_j":""),have,have,rev);
 if(!addXP(5))S.msg="Sold "+have+(isJoint?" joints":"g")+" of "+st.name+" to "+d.name+" for "+money(rev)+"."+(dh3>0?" Same spot too many times — heat +"+dh3+".":"");
 showSalePop(st.name,have+(isJoint?" joints":"g"),rev,prof2);
 battleRoll();
 save();render();
}

function tickerHints(){
 var L=pLevel(),econ=[],info=[],status=[];
 var di=DUFFEL.indexOf(S.stashCap);
 // ECONOMIC — most money-relevant first
 for(var _lt=Math.max(1,L-1);_lt<=L;_lt++){

 }
 var jtot=GROWKEYS.reduce(function(a,k){return a+(S.joints[k]||0);},0);
 if(jtot>0)econ.push("Smoke a joint: -4 heat and better sell prices for 5 min");
 econ.push("Deal prices drift — buy low, sell high");
 if(di<DUFFEL.length-1)econ.push("Duffel cramped? Upgrade at the Supply Depot — carry up to "+DUFFEL[DUFFEL.length-1]+"g");
 var hasW=S.weapons&&Object.keys(S.weapons).some(function(w){return S.weapons[w];});
 if(!hasW&&L>=2)econ.push("No weapon yet — hit the Gun Store before the cops jump you");
 if(S.props.length<2&&L>=2)econ.push("Trap House: 6 grow slots — see Green Realty");
 if(L>=3){
  var hasKit=S.kits&&Object.keys(S.kits).some(function(k){return (S.kits[k]||0)>0;});
  if(!hasKit)econ.push("No lab kits — stock up at Lab Supply to start cooking");
 }
 if((S.fert||0)<=0)econ.push("Out of fertilizer — Supply Depot sells instant +30 growth");
 // INFO
 if(L<8&&UNLOCKS[L+1])info.push("Level "+(L+1)+" unlocks: "+UNLOCKS[L+1].join(", "));
 info.push("Stash tab: roll, smoke or sell every bag in one place");
 // STATUS — last
 var thirsty=false;
 S.props.forEach(function(pr){pr.slots.forEach(function(p){if(p&&p.water<20)thirsty=true;});});
 if(thirsty)status.push("Plants are thirsty — hit Water All");
 if(stashTotal()>=S.stashCap*0.9)status.push("Duffel almost full — sell or upgrade before your next harvest");

 else if(S.heat>=40)status.push("Heat rising — keep it cool");

var tickerState={x:0,last:0,pausedUntil:0,count:0,fast:false};
var tickIdx=0;
function tickerSpeed(){return tickerState.fast?34:18;}
function tickerTick(){
 var track=q(".ticker-track");
 if(!track||!track.children.length)return;
 var now=Date.now();
 if(!tickerState.last)tickerState.last=now;
 var dt=Math.min(0.5,(now-tickerState.last)/1000);
 tickerState.last=now;
 if(now<tickerState.pausedUntil)return;
 var half=track.scrollWidth/2;
 if(half<=0)return;
 tickerState.x+=dt*tickerSpeed();
 if(tickerState.x>=half)tickerState.x-=half;
 track.style.transform="translateX("+(-tickerState.x)+"px)";
}

 var half=hints.map(function(h,i){return '<span class="ticker-chunk" data-i="'+i+'">'+esc(h)+'<span class="tick-sep">\u2022\u2022\u2022</span></span>';}).join("");
 track.innerHTML=half+half;

}

function tick(){
 var now=Date.now();
 var dtm=Math.max(0,(now-S.lastTick)/60000);
 S.lastTick=now;
 if(S.buffUntil&&now>S.buffUntil){S.buffMult=1;S.buffUntil=0;}
 if(dtm>0){
  S.props.forEach(function(pr){
   pr.slots.forEach(function(p){
    if(!p)return;
    var wr=100/35,gr=100/growMinOf(p.strain);
    var growTime=p.water>15?Math.min(dtm,(p.water-15)/wr):0;
    p.water=Math.max(0,p.water-dtm*wr);
    if(p.growth<100)p.growth=Math.min(100,p.growth+growTime*gr);
   });
  });
  if(now>=S.driftAt){var _nd=0;while(now>=S.driftAt&&_nd<24){driftDealers();S.driftAt+=4*60000;_nd++;}if(now>=S.driftAt)S.driftAt=now+4*60000;}
  if(S.heat>0){var _hd=dtm*2.5;if(S.buffUntil&&now<S.buffUntil)_hd+=dtm*0.5;S.heat=Math.max(0,S.heat-_hd);}
  if(S.hp<100)S.hp=Math.min(100,S.hp+dtm/2);
 }
 if(S.job){
  if(S.job.phase==="cooking"&&Date.now()>=S.job.readyAt)settleCooking();
  else if(!S.job.phase)settleJob();
 }
 save();render();
}

 var now=Date.now();

function pump(){
 if(!S.job)return;
 var j=S.job;
 if(j.phase==="cooking"){
  var rem=Math.max(0,j.readyAt-Date.now()),tot=Math.max(1,j.readyAt-j.cookStart);
  var cc=q(".cook-count");if(cc)cc.textContent=fmtT(Math.ceil(rem/1000));
  var cf=q(".cook-fill");if(cf)cf.style.width=Math.min(100,(tot-rem)/tot*100)+"%";
  if(rem<=0)settleCooking();
  return;
 }
 if(j.phase==="ready")return;
 var r=RECIPES[j.key],now=Date.now();
 if(r.game==="tap"||(r.game==="finale"&&j.fin.stage===0)){
  var tp=j.tp;
  var fill=q(".tap-fill");if(fill)fill.style.width=Math.min(100,tp.have/tp.need*100)+"%";
  var tt=q(".tap-time");if(tt)tt.textContent=Math.max(0,Math.ceil((tp.deadline-now)/1000))+"s left";
  if(now>=tp.deadline){
   if(r.game==="finale"){j.fin.scores.push(tp.have>=tp.need?1:0.5);j.fin.stage=1;S.msg="Time! Now pull.";save();render();}
   else finishCook(tp.have>=tp.need?1:0.5);
  }
  return;
 }
 if(r.game==="timing"||r.game==="freezethaw"||(r.game==="finale"&&j.fin.stage===1)){
  var mk=q(".tm-mark");if(mk)mk.style.left=(markerPos(now)*100)+"%";
  return;
 }
 if(r.game==="target"){
  var t=j.tg;
  qa(".tg-pad").forEach(function(el,i){el.classList.toggle("lit",t.lit===i);});
  if(now-t.litAt>1300){
   t.round++;
   if(t.round>=5){finishCook(0.5+0.5*t.hits/5);return;}
   t.lit=(Math.random()*3)|0;t.litAt=now;
   save();render();
  }
  return;
 }
 if(r.game==="memory"||(r.game==="finale"&&j.fin.stage===2)){
  var m=j.mem,pads=qa(".mm-pad");
  if(m.phase==="show"){
   var idx=Math.floor((now-m.showStart)/500);
   pads.forEach(function(el,i){el.classList.toggle("lit",i===m.seq[idx]);});
   if(now-m.showStart>m.seq.length*500+400){m.phase="input";m.input=[];save();render();}
  }
 }
}
function settleJob(){
 var j=S.job;if(!j)return;
 var r=RECIPES[j.key],now=Date.now();
 if((r.game==="tap"||(r.game==="finale"&&j.fin.stage===0))&&now>=j.tp.deadline){
  if(r.game==="finale"){j.fin.scores.push(j.tp.have>=j.tp.need?1:0.5);j.fin.stage=1;S.msg="Time! Now pull.";save();render();}
  else finishCook(j.tp.have>=j.tp.need?1:0.5);
 }
}
