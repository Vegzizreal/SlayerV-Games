<script>
/* Vegas Forever Homes - hand-rolled canvas 3D engine (no dependencies, fits the 1MB widget cap).
   Boxes + low-poly spheres, painter's algorithm, per-face shading. */
var PG = window.PG || (window.PG = {});
PG.E3D = (function(){
"use strict";

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ---- camera ---- */
function makeCamera(px,py,pz, tx,ty,tz, fovDeg){
  var fx=tx-px, fy=ty-py, fz=tz-pz;
  var len=Math.sqrt(fx*fx+fy*fy+fz*fz)||1;
  fx/=len; fy/=len; fz/=len;
  return { pos:[px,py,pz],
           yaw: Math.atan2(-fx,-fz),
           pitch: -Math.asin(clamp(fy,-1,1)),
           fov: fovDeg*Math.PI/180 };
}

/* world -> camera space */
function toCam(p, cam){
  var dx=p[0]-cam.pos[0], dy=p[1]-cam.pos[1], dz=p[2]-cam.pos[2];
  var cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  var x2=dx*cy - dz*sy, z2=dx*sy + dz*cy, y2=dy;
  var cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  var y3=y2*cp - z2*sp, z3=y2*sp + z2*cp;
  return [x2,y3,z3];
}

function project(p, cam, W, H){
  var c=toCam(p,cam);
  var dist=-c[2];              // camera looks along -Z in cam space
  if(dist<0.05) return null;   // behind camera
  var f=(H/2)/Math.tan(cam.fov/2);
  return [ W/2 + (c[0]*f)/dist, H/2 - (c[1]*f)/dist, dist ];
}

/* rotate point about Y then X then Z (yaw, pitch, roll) */
function rotPt(p, yaw, pitch, roll){
  var x=p[0],y=p[1],z=p[2], t;
  if(yaw){ var c=Math.cos(yaw),s=Math.sin(yaw); t=x*c - z*s; z=x*s + z*c; x=t; }
  if(pitch){ var c=Math.cos(pitch),s=Math.sin(pitch); t=y*c - z*s; z=y*s + z*c; y=t; }
  if(roll){ var c=Math.cos(roll),s=Math.sin(roll); t=x*c - y*s; y=x*s + y*c; x=t; }
  return [x,y,z];
}

/* A "part" is a renderable chunk in model-local space:
   { kind:'box', w,h,d, at:[x,y,z], yaw,pitch,roll, pivot:[x,y,z], colors:{...}|color }
   { kind:'sphere', r, segs, at, yaw..., color }
   parent transform: {pos:[x,y,z], yaw} applied after part-local transform. */
function partWorldVerts(part, parent){
  var pts = part.kind==='sphere' ? sphereVerts(part)
          : part.kind==='roundbox' ? roundboxVerts(part)
          : part.kind==='prism' ? prismVerts(part)
          : boxVerts(part);
  var piv = part.pivot||[0,0,0];
  var out = [];
  for(var i=0;i<pts.length;i++){
    var p=[pts[i][0]-piv[0], pts[i][1]-piv[1], pts[i][2]-piv[2]];
    p=rotPt(p, part.yaw||0, part.pitch||0, part.roll||0);
    p=[p[0]+piv[0]+part.at[0], p[1]+piv[1]+part.at[1], p[2]+piv[2]+part.at[2]];
    if(parent){
      if(parent.scale&&parent.scale!==1) p=[p[0]*parent.scale,p[1]*parent.scale,p[2]*parent.scale];
      p=rotPt(p, parent.yaw||0, 0, 0);
      p=[p[0]+parent.pos[0], p[1]+parent.pos[1], p[2]+parent.pos[2]];
    }
    out.push(p);
  }
  return out;
}

function boxVerts(part){
  var w=part.w/2,h=part.h/2,d=part.d/2;
  return [[-w,-h,-d],[w,-h,-d],[w,h,-d],[-w,h,-d],
          [-w,-h,d],[w,-h,d],[w,h,d],[-w,h,d]];
}
/* Rounded box: superellipsoid. e=1 -> ellipsoid, e->0 -> sharp box.
   e~0.4-0.6 gives a soft beveled box. Same w/h/d footprint as boxVerts. */
function roundboxVerts(part){
  var e=(part.e==null?0.45:part.e), n=part.segs||8;
  var a=part.w/2, b=part.h/2, c=part.d/2;
  function pw(t){ return t<0 ? -Math.pow(-t,e) : Math.pow(t,e); }
  var v=[];
  for(var i=0;i<=n;i++){
    var u=-Math.PI/2 + i/n*Math.PI;
    var cu=Math.cos(u), su=Math.sin(u);
    for(var j=0;j<=n;j++){
      var vv=-Math.PI + j/n*2*Math.PI;
      var cv=Math.cos(vv), sv=Math.sin(vv);

      faces.push({idx:[a,b2,d2,c2], n:null, k:'side'}); // outward winding

}

/* Triangular prism: ridge along z. For pitched roofs / gables. */
function prismVerts(part){
  var w=part.w/2,h=part.h/2,d=part.d/2;
  return [[-w,-h,-d],[w,-h,-d],[0,h,-d],

}
function prismFaces(){
  return [
    {idx:[0,2,1], n:null, k:'back'},
    {idx:[3,4,5], n:null, k:'front'},
    {idx:[0,3,5,2], n:null, k:'left'},
    {idx:[1,2,5,4], n:null, k:'right'},
    {idx:[0,1,4,3], n:null, k:'bottom'}

/* box faces: indices into boxVerts, with base shade key */
function boxFaces(){
  return [
    {idx:[4,5,6,7], n:[0,0,1],  k:'front'},
    {idx:[1,0,3,2], n:[0,0,-1], k:'back'},
    {idx:[5,1,2,6], n:[1,0,0],  k:'right'},
    {idx:[0,4,7,3], n:[-1,0,0], k:'left'},
    {idx:[7,6,2,3], n:[0,1,0],  k:'top'},
    {idx:[0,1,5,4], n:[0,-1,0], k:'bottom'}

function sphereVerts(part){
  var n=part.segs||8, r=part.r, v=[];
  for(var i=0;i<=n;i++){
    var th=i/n*Math.PI, y=r*Math.cos(th), rr=r*Math.sin(th);

      v.push([rr*Math.cos(ph), y, rr*Math.sin(ph)]);
    }

}
function sphereFaces(part){
  var n=part._sn||part.segs||8, faces=[];
  for(var i=0;i<n;i++){
    for(var j=0;j<n;j++){
      var a=i*n+j, b=i*n+((j+1)%n), c=(i+1)*n+j, d=(i+1)*n+((j+1)%n);
      if(i===0){ faces.push({idx:[a,c,b], n:null, k:'top'}); }
      else if(i===n-1){ faces.push({idx:[a,b,d], n:null, k:'bottom'}); }
      else { faces.push({idx:[a,c,d,b], n:null, k:'side'}); }

}

/* face color: base hex -> shaded by world normal */
var LIGHT=[-0.45,0.75,0.5];
(function(){ var l=Math.sqrt(LIGHT[0]*LIGHT[0]+LIGHT[1]*LIGHT[1]+LIGHT[2]*LIGHT[2]); LIGHT=[LIGHT[0]/l,LIGHT[1]/l,LIGHT[2]/l]; })();

/* world normal -> part-local normal (undo parent yaw + part roll/pitch/yaw).
 * Used for per-face color keys so a pitching part doesn't flip its colors. */
function localNormal(n, part, parent){
  var x=n[0], y=n[1], z=n[2], t, c, s;
  var py=-((parent&&parent.yaw)||0);
  if(py){ c=Math.cos(py); s=Math.sin(py); t=x*c - z*s; z=x*s + z*c; x=t; }
  var rl=-(part.roll||0);
  if(rl){ c=Math.cos(rl); s=Math.sin(rl); t=x*c - y*s; y=x*s + y*c; x=t; }
  var pi=-(part.pitch||0);
  if(pi){ c=Math.cos(pi); s=Math.sin(pi); t=y*c - z*s; z=y*s + z*c; y=t; }
  var ya=-(part.yaw||0);
  if(ya){ c=Math.cos(ya); s=Math.sin(ya); t=x*c - z*s; z=x*s + z*c; x=t; }
  return [x,y,z];

function collectFaces(parts, cam, parent){
  var out=[];
  for(var pi=0; pi<parts.length; pi++){
    var part=parts[pi];
    if(part.hidden) continue;
    var verts=partWorldVerts(part, parent);
    var faces = part.kind==='sphere' ? sphereFaces(part)
              : part.kind==='roundbox' ? roundboxFaces(part)
              : part.kind==='prism' ? prismFaces()
              : boxFaces();
    var base = part.color || '#888888';
    var perFace = part.colors || null;
    for(var fi=0; fi<faces.length; fi++){
      var f=faces[fi];
      var wpts=[], ok=true;
      for(var k=0;k<f.idx.length;k++){ wpts.push(verts[f.idx[k]]); }
      // world normal
      var e1=sub(wpts[1],wpts[0]), e2=sub(wpts[2],wpts[0]);
      var n=cross(e1,e2);
      var nl=Math.sqrt(n[0]*n[0]+n[1]*n[1]+n[2]*n[2]);
      if(nl<1e-9) continue;
      n=[n[0]/nl,n[1]/nl,n[2]/nl];
      // backface cull: facing away from camera?
      var toCamV=sub(cam.pos, wpts[0]);
      var tl=Math.sqrt(toCamV[0]*toCamV[0]+toCamV[1]*toCamV[1]+toCamV[2]*toCamV[2])||1;
      var facing=(n[0]*toCamV[0]+n[1]*toCamV[1]+n[2]*toCamV[2])/tl;
      if(facing<=0.02) continue;
      var lam=Math.max(0, n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
      var sf=0.52+0.48*lam;
      // rounded boxes have one generic face key: pick it from the dominant
      // world-normal axis so per-face colors (e.g. a belly) still land right
      var fk=f.k;
      if(perFace&&part.kind==='roundbox'){
        var ln=localNormal(n,part,parent);
        var ax=Math.abs(ln[0]), ay=Math.abs(ln[1]), az=Math.abs(ln[2]);
        if(ay>=ax&&ay>=az) fk=ln[1]>0?'top':'bottom';
        else if(ax>=az) fk=ln[0]>0?'right':'left';
        else fk=ln[2]>0?'front':'back';
      }
      var col = perFace ? (perFace[fk]||base) : base;
      var depth=0;
      for(var k2=0;k2<wpts.length;k2++){
        var d=wpts[k2];
        depth+=Math.sqrt((d[0]-cam.pos[0])*(d[0]-cam.pos[0])+(d[1]-cam.pos[1])*(d[1]-cam.pos[1])+(d[2]-cam.pos[2])*(d[2]-cam.pos[2]));
      }
      depth/=wpts.length;
      out.push({pts:wpts, color:shade(col,sf), depth:depth});
    }
  }
  return out;
}

/* render a list of parts; parts may each carry their own parent via part._parent */
function render(ctx, cam, parts, W, H){
  var all=[];
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var faces=collectFaces([p], cam, p._parent||null);
    for(var j=0;j<faces.length;j++) all.push(faces[j]);
  }
  all.sort(function(a,b){ return b.depth-a.depth; });
  for(var k=0;k<all.length;k++){
    var f=all[k], pts2d=[], ok=true;
    for(var m=0;m<f.pts.length;m++){
      var pr=project(f.pts[m], cam, W, H);
      if(!pr){ ok=false; break; }
      pts2d.push(pr);
    }
    if(!ok||pts2d.length<3) continue;
    ctx.fillStyle=f.color;
    ctx.beginPath();
    ctx.moveTo(pts2d[0][0],pts2d[0][1]);
    for(var m2=1;m2<pts2d.length;m2++) ctx.lineTo(pts2d[m2][0],pts2d[m2][1]);
    ctx.closePath();
    ctx.fill();
  }
}

return {
  makeCamera: makeCamera,
  project: project,
  render: render,
  collectFaces: collectFaces,
  shade: shade,
  hexRgb: hexRgb,
  clamp: clamp

/* Vegas Forever Homes - device-time day/night cycle for the backyard sky. Pure logic, DOM-free. */
var PG = (typeof window!=='undefined') ? (window.PG||(window.PG={})) : (global.PG||(global.PG={}));
PG.DayNight = (function(){
"use strict";

/* Sky keyframes: hour -> gradient stops, ambient darken overlay, star/sun/moon alphas.
 * Colors echo the game's existing oil-paint backdrops. */
var STOPS=[
  {h:0,   sky:['#0b1026','#16224a','#23365e'], darken:0.45, stars:1,    sun:0,    moon:0.95},
  {h:5,   sky:['#0b1026','#16224a','#23365e'], darken:0.45, stars:1,    sun:0,    moon:0.95},
  {h:6.5, sky:['#4a3a6e','#b96a5e','#f2a56b'], darken:0.14, stars:0.25, sun:0.55, moon:0.12}, // dawn
  {h:8,   sky:['#6ec1f5','#a5dcfc','#d8f0fc'], darken:0,    stars:0,    sun:1,    moon:0},    // day
  {h:17,  sky:['#6ec1f5','#a5dcfc','#d8f0fc'], darken:0,    stars:0,    sun:1,    moon:0},
  {h:18.5,sky:['#3b2d5c','#c65b3f','#f7b267'], darken:0.16, stars:0.2,  sun:0.85, moon:0.08}, // sunset
  {h:20,  sky:['#0b1026','#16224a','#23365e'], darken:0.45, stars:1,    sun:0,    moon:0.95},
  {h:24,  sky:['#0b1026','#16224a','#23365e'], darken:0.45, stars:1,    sun:0,    moon:0.95}
];

function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function mixc(a,b,t){
  return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];
}
function css(rgb){ return 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')'; }

/* hour: 0-24 float (device local time). Returns blended sky + light levels. */
function at(hour){
  var h=((hour%24)+24)%24;
  var a=STOPS[0], b=STOPS[STOPS.length-1];
  for(var i=0;i<STOPS.length-1;i++){
    if(h>=STOPS[i].h&&h<=STOPS[i+1].h){ a=STOPS[i]; b=STOPS[i+1]; break; }
  }
  var span=(b.h-a.h)||1, t=(h-a.h)/span;
  t=t*t*(3-2*t); // smoothstep: gentler blends between keyframes
  function L(f){ return a[f]+(b[f]-a[f])*t; }
  var sky=[0,1,2].map(function(k){ return css(mixc(hx(a.sky[k]),hx(b.sky[k]),t)); });
  return {top:sky[0], mid:sky[1], bot:sky[2],
    darken:L('darken'), stars:L('stars'), sun:L('sun'), moon:L('moon'),
    phase:phase(h)};
}

function phase(h){
  h=((h%24)+24)%24;
  if(h<5||h>=20) return 'Night';
  if(h<8) return 'Dawn';
  if(h<17) return 'Day';
  return 'Sunset';
}

/* Device-local hour as a float, e.g. 21.5 == 9:30 PM. */
function deviceHour(){
  var d=new Date();
  return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
}

return {STOPS:STOPS, at:at, phase:phase, deviceHour:deviceHour};
})();
if(typeof module!=='undefined'&&module.exports){ module.exports=PG.DayNight; }

function normalize(s){

  if(s.foster&&typeof s.foster==='object'&&!Array.isArray(s.foster)){
    var oldF=s.foster;
    ['hunger','fun','energy','health','bond'].forEach(function(k){
      if(typeof s[k]==='number') oldF[k]=s[k];
    });
    ['poop','sick','sleeping','critical','neglectHrs'].forEach(function(k){
      if(typeof s[k]!=='undefined') oldF[k]=s[k];

    s.v=3;

  });
  if(typeof s.msg!=='object'||!s.msg)s.msg={txt:'',at:0};
  if(s.theme!=='light'&&s.theme!=='dark')s.theme='dark'; // UI theme, dark is default
  if(['auto','day','sunset','night'].indexOf(s.bg)<0)s.bg='auto'; // unknown backdrop -> device-time cycle
  s.fosters.forEach(function(f){
    if(!f||typeof f!=='object') return;
    ['hunger','fun','energy','health','bond'].forEach(function(k){ f[k]=clamp(f[k]); });
    f.poop=Math.max(0,Math.min(5,f.poop|0));
  });
  s.bones=Math.max(0,Math.floor(s.bones||0));
  // migrate v1 saves: drop old toys, grant starter bones
  if(s.v<2){ s.v=3; s.fosters=[newFoster()]; s.fosters[0].name=(s.name||'Buddy'); s.fosterIdx=0; }
  return s;
}

function levelOf(xp){
  var lvl=1;
  for(var i=0;i<XP_LEVELS.length;i++){ if(xp>=XP_LEVELS[i]) lvl=i+1; }
  return Math.min(lvl,MAX_LEVEL);
}

function buffActive(S,id,now){ return (S.buffs[id+'Until']||0)>now; }

/* Trainer bonus: each resident Trainer boosts foster XP by 15%. */
function trainerBonus(S){ return 0.15*S.residents.length; }

/* grant XP; foster gets (1+trainerBonus), each resident gets 25% base.
   A dog in critical condition earns NO xp until a vet visit.
   Returns {levels:[...foster level-ups], rLevels:[{name,level}...], blocked} */
function grantXp(S,n,now){
  var F=sel(S);
  if(F.critical) return {levels:[],rLevels:[],blocked:true};
  var before=F.level, ups=[], rUps=[];
  var mult=1+trainerBonus(S);
  F.xp+=n*mult;
  var after=levelOf(F.xp);
  if(after>before){
    for(var l=before+1;l<=after;l++){
      ups.push(l);
      var bonus=l*5;
      S.bones+=bonus; S.lifetime.bonesEarned+=bonus;
    }
    F.level=after;
  }
  S.residents.forEach(function(r){
    var rb=r.level, share=n*0.25;
    r.xp+=share;
    var ra=levelOf(r.xp);
    if(ra>rb){ r.level=ra; rUps.push({name:r.name,level:ra}); }
  });
  return {levels:ups, rLevels:rUps};
}

/* advance simulation; now=ms. returns list of {t, i} events (i = foster index) */
function tick(S,now){
  var ev=[];
  var dtH=Math.max(0,(now-S.lastTick)/3600000);
  if(dtH<=0) return ev;
  dtH=Math.min(dtH,48);
  var blanket=buffActive(S,'blanket',now);

  S.fosters.forEach(function(f,fi){
    if(!f||typeof f!=='object') return;
    var sleeping=!!f.sleeping;
    var puppy=(now-(f.arrivedAt||0))<24*3600000; // new pups burn through everything 2x faster
    var pupMul=puppy?2:1;

    f.hunger=clamp(f.hunger-(sleeping?3:6)*pupMul*(S.upkeepMissed?1.5:1)*dtH);
    var funDrain=7*pupMul*(S.upgrades.sprinkler?0.7:1);
    f.fun=clamp(f.fun-funDrain*dtH);
    f.energy=clamp(f.energy+(sleeping?(blanket?60:30)*(S.upgrades.heatedbed?1.5:1):(blanket?-2.5:-5))*dtH);
    var avg=(f.hunger+f.fun)/2;
    var bondDelta=(avg>60?1:-2)*dtH;
    if(buffActive(S,'treats',now)&&bondDelta<0) bondDelta*=0.5;
    f.bond=clamp(f.bond+bondDelta);

    if(f.hunger>20&&f.poop<3&&Math.random()<0.25*dtH){ f.poop++; ev.push({t:'poop',i:fi}); }

    var target=(f.hunger+f.fun+f.energy)/3-f.poop*8;
    f.health=clamp(f.health+(target-f.health)*Math.min(1,4*dtH/10));
    if(f.health<5)f.health=5;

    var wasSick=f.sick;
    f.sick=f.health<40&&!buffActive(S,'groom',now);
    if(f.sick&&!wasSick)ev.push({t:'sick',i:fi});
    if(!f.sick&&wasSick)ev.push({t:'recovered',i:fi});

    /* neglect escalation: starving or near-death for 6+ hours -> critical, no XP until vet */
    if(f.hunger<=0||f.health<25) f.neglectHrs+=dtH;
    else f.neglectHrs=Math.max(0,f.neglectHrs-2*dtH);
    if(f.neglectHrs>=6&&!f.critical){ f.critical=true; ev.push({t:'critical',i:fi}); }
  });

  /* daily kibble upkeep + care streak (cost scales with pack size) */
  if(now-S.lastUpkeep>=24*3600000){
    var cost=6+3*S.residents.length+2*Math.max(0,S.fosters.length-1);
    var f0=sel(S);
    if(S.bones>=cost){
      S.bones-=cost;
      S.upkeepMissed=false;
      setMsg(S,'Daily kibble: -'+cost+' Bones. ('+f0.name+' eats well!)');
    }else{
      S.upkeepMissed=true;
      setMsg(S,'Could not afford kibble! '+f0.name+' is getting extra hungry...');
    }
    var worst=100;
    S.fosters.forEach(function(f){ worst=Math.min(worst,f.hunger,f.fun,f.energy,f.health); });
    S.streak=(worst>60)?S.streak+1:0;
    S.lastUpkeep=now;
    ev.push({t:'upkeep',i:-1});
  }

  /* random backyard events (no escapes — disabled by design) */
  if(Math.random()<0.05*dtH){
    var ri=(Math.random()*S.fosters.length)|0, rf=S.fosters[ri];
    rf.energy=clamp(rf.energy-25); rf.fun=clamp(rf.fun-15);
    setMsg(S,'A thunderstorm rolled through! '+rf.name+' is shaken.');
    ev.push({t:'storm',i:ri});
  }else if(Math.random()<0.04*dtH){
    var si=(Math.random()*S.fosters.length)|0, sf=S.fosters[si];
    var shoeCost=Math.min(15,S.bones);
    S.bones-=shoeCost; sf.bond=clamp(sf.bond-8);
    setMsg(S,sf.name+' chewed your shoe! Replacement cost '+shoeCost+' Bones.');
    ev.push({t:'shoe',i:si});
  }

  S.lastTick=now;
  return ev;
}

function setMsg(S,txt){ S.msg={txt:txt,at:Date.now()}; }
function bondGain(S,n,now){ return n*(buffActive(S,'treats',now)?2:1); }

/* vet bill scales with foster level; the visit also clears critical condition */
function vetCost(S){ return 15+5*sel(S).level; }

/* streak bonus: +10% Treat Match bones per consecutive well-cared day, capped at +100% */
function streakBonus(S){ return Math.min(S.streak,10)*0.1; }

/* buy a permanent backyard upgrade */
function buyUpgrade(S,id,now){
  now=now||Date.now();
  var u=null;
  for(var i=0;i<UPGRADES.length;i++) if(UPGRADES[i].id===id)u=UPGRADES[i];
  if(!u) return {ok:false,msg:'Unknown upgrade.'};
  if(S.upgrades[id]) return {ok:false,msg:u.name+' is already installed!'};
  if(S.bones<u.cost) return {ok:false,msg:'Not enough Bones ('+u.cost+'). Play Treat Match!'};
  S.bones-=u.cost; S.lastCare=now; S.upgrades[id]=true;
  var msg=u.name+' installed! '+u.desc;
  setMsg(S,msg);
  return {ok:true,msg:msg};
}

/* doAction(S,id,now) -> {ok,msg,anim,cost} ; mutates S */
function doAction(S,id,now){
  now=now||Date.now();
  var F=sel(S), n=F.name;
  var r={ok:false,msg:'',anim:null,cost:0};
  function ok(msg,anim,xp){
    S.lastCare=now;
    var g=grantXp(S,xp||0,now);
    r.ok=true; r.anim=anim||null; r.levels=g.levels;
    if(g.blocked) msg+=' '+n+' is in critical condition \u2014 no XP until a vet visit!';
    if(g.levels.length){
      var L=g.levels[g.levels.length-1];
      msg+=' '+n+' reached Level '+L+'! (+'+(L*5)+' Bones)';
      r.anim='celebrate';
    }
    g.rLevels.forEach(function(rl){ msg+=' '+rl.name+' (Trainer) reached Level '+rl.level+'!'; });
    r.msg=msg; setMsg(S,msg);
    return r;
  }

  if(id==='feed'){
    if(F.hunger>=100){ r.msg=n+' is stuffed! Maybe later.'; setMsg(S,r.msg); return r; }
    var kib=S.products.kibble>0;
    if(kib)S.products.kibble--;
    F.hunger=clamp(F.hunger+(kib?27:18)); F.fun=clamp(F.fun+2);
    F.bond=clamp(F.bond+bondGain(S,1,now));
    return ok(kib?'Premium kibble! '+n+' devours it.':'munch munch... tasty biscuit!','eat',kib?12:8);
  }
  if(id==='play'){
    if(F.sleeping){ r.msg='Shhh... '+n+' is asleep.'; setMsg(S,r.msg); return r; }
    if(F.energy<12){ r.msg=n+' is too tired to play. Let them rest.'; setMsg(S,r.msg); return r; }
    var chew=S.products.chew>0;
    if(chew)S.products.chew--;
    F.fun=clamp(F.fun+(chew?38:25)); F.energy=clamp(F.energy-12);
    F.hunger=clamp(F.hunger-5); F.bond=clamp(F.bond+bondGain(S,4,now));
    var pxp=chew?18:12;
    if(S.upgrades.agility) pxp=Math.round(pxp*1.5);
    return ok(chew?'The chew toy makes playtime amazing!':'So much fun! '+n+' loves playtime.','play',pxp);
  }
  if(id==='sleep'){
    F.sleeping=!F.sleeping;
    if(F.sleeping) return ok('Goodnight, '+n+'. Zzz...', 'sleep', 0);
    var rested=F.energy>70;
    return ok(n+' wakes up, stretching!'+(rested?' Fully rested!':''), 'wake', rested?5:0);
  }
  if(id==='clean'){
    if(F.poop>0){ F.poop=0; F.fun=clamp(F.fun+5); return ok('All cleaned up! Fresh backyard.','idle',6); }
    r.msg='The backyard is already spotless.'; setMsg(S,r.msg); return r;
  }
  if(id==='packplay'){
    var nT=S.residents.length;
    if(nT===0){ r.msg='Keep a foster as a Trainer first!'; setMsg(S,r.msg); return r; }
    if(F.sleeping){ r.msg='Shhh... '+n+' is asleep.'; setMsg(S,r.msg); return r; }
    if(F.energy<18){ r.msg='The pack is too tired. Let them rest.'; setMsg(S,r.msg); return r; }
    F.fun=clamp(F.fun+30+10*nT); F.energy=clamp(F.energy-18);
    F.hunger=clamp(F.hunger-6); F.bond=clamp(F.bond+bondGain(S,5,now));
    var pkxp=15+5*nT;
    if(S.upgrades.agility) pkxp=Math.round(pkxp*1.5);
    return ok('PACK PLAY! '+n+' romps with the whole pack!','play',pkxp);
  }
  if(id==='vet'){
    var vc=vetCost(S);
    if(S.bones<vc){ r.msg='The vet costs '+vc+' Bones.'; setMsg(S,r.msg); return r; }
    if(!F.sick&&!F.critical&&F.health>85){ r.msg=n+' is perfectly healthy!'; setMsg(S,r.msg); return r; }
    S.bones-=vc; r.cost=vc;
    F.health=clamp(F.health+40); F.sick=F.health<40; F.critical=false; F.neglectHrs=0;
    return ok('Vet visit done! '+n+' feels much better.','celebrate',10);
  }
  r.msg='Unknown action.'; return r;
}

/* buy a product with Bones */
function buyProduct(S,id,now){
  now=now||Date.now();
  var p=null;
  for(var i=0;i<PRODUCTS.length;i++) if(PRODUCTS[i].id===id)p=PRODUCTS[i];
  if(!p) return {ok:false,msg:'Unknown product.'};
  if(S.bones<p.cost) return {ok:false,msg:'Not enough Bones ('+p.cost+'). Play Treat Match!'};
  S.bones-=p.cost; S.lastCare=now;
  if(id==='kibble')S.products.kibble+=5;
  else if(id==='chew')S.products.chew+=5;
  else if(id==='blanket')S.buffs.blanketUntil=now+24*3600000;
  else if(id==='groom'){ var gf=sel(S); gf.health=clamp(gf.health+25); gf.sick=gf.health<40; S.buffs.groomUntil=now+24*3600000; }
  else if(id==='treats')S.buffs.treatsUntil=now+24*3600000;
  var msg=p.name+' bought! '+p.desc;
  setMsg(S,msg);
  return {ok:true,msg:msg};
}

/* Adoption Day check. Families judge your care: great stats spark a bidding
   war, poor stats make them walk away. Returns null or {outcome,reward,score}. */
function checkAdoption(S,now){
  now=now||Date.now();
  var F=sel(S);
  if(F.level<5) return null;
  if(now<S.adoptCooldownUntil) return null;
  var score=Math.round((F.hunger+F.fun+F.energy+F.health+F.bond)/5);
  if(score>=85) return {outcome:'perfect',reward:150+(score-85)*5,score:score};
  if(score>=65) return {outcome:'good',reward:50+score,score:score};
  S.adoptCooldownUntil=now+24*3600000;
  if(score>=50) return {outcome:'walkaway',reward:0,score:score};
  return {outcome:'postponed',reward:0,score:score};
}

/* remove the selected foster; a new puppy arrives if under the property cap */
function _replaceFoster(S,avoidName){
  var cap=PG.Props?PG.Props.cur(S).fosters:1;
  S.fosters.splice(S.fosterIdx,1);
  if(S.fosterIdx>=S.fosters.length) S.fosterIdx=Math.max(0,S.fosters.length-1);
  if(S.fosters.length<cap){
    S.fosters.push(newFoster(avoidName));
    S.fosterIdx=S.fosters.length-1;
    return S.fosters[S.fosterIdx];
  }
  return null;
}

/* finalize an adoption; returns farewell text */
function doAdopt(S,res,now){
  now=now||Date.now();
  var F=sel(S);
  var n=F.name, L=F.level;
  S.bones+=res.reward; S.lifetime.bonesEarned+=res.reward;
  S.lifetime.adopted++;
  var txt;
  if(res.outcome==='perfect')
    txt='BIDDING WAR! Three families fell in LOVE with '+n+'! "A perfect match," they said. '+n+' got adopted into a wonderful forever home (Level '+L+'). +'+res.reward+' Bones! You have fostered '+S.lifetime.adopted+' dog'+(S.lifetime.adopted>1?'s':'')+' so far.';
  else
    txt=n+' got adopted! A good family took '+n+' home (Level '+L+'). +'+res.reward+' Bones.';
  var pup=_replaceFoster(S,n);
  S.adoptCooldownUntil=0;S.lastCare=now;
  if(pup) setMsg(S,txt+' A new puppy, '+pup.name+', has arrived!');
  else setMsg(S,txt);
  return txt;
}

/* Keep the foster permanently: they become a Trainer. Returns {ok,msg}. */
function keepFoster(S,now){
  now=now||Date.now();
  var cap=PG.Props?PG.Props.cur(S).trainers:3;
  if(S.residents.length>=cap) return {ok:false,msg:'Your property is full! ('+cap+' Trainers max)'};
  var f=sel(S);
  S.residents.push({name:f.name,breed:f.breed,fur:f.fur,belly:f.belly,mark:f.mark,level:f.level,xp:f.xp,coatFx:f.coatFx||null});
  var msg=f.name+' is home forever! They are now a Trainer (+15% XP for future fosters).';
  var pup=_replaceFoster(S,f.name);
  S.adoptCooldownUntil=0;S.lastCare=now;
  if(pup) setMsg(S,msg+' A new puppy, '+pup.name+', has arrived!');
  else setMsg(S,msg);
  return {ok:true,msg:msg};
}
function moodOf(S){
  var F=sel(S);
  return {
    happy:(F.fun+F.bond)/200,
    hungry:F.hunger<35, tired:F.energy<30, sad:F.fun<30,
    sick:F.sick, messy:F.poop>0, sleeping:F.sleeping
  };
}

function statusLine(S){
  var m=moodOf(S), F=sel(S), n=F.name;
  if(F.critical) return n+' is in CRITICAL condition! Get to the vet NOW.';
  if(m.sleeping) return n+' is dreaming... Zzz';
  if(m.sick) return n+' feels sick. Maybe a vet visit?';
  if(F.level>=5) return 'ADOPTION DAY! A family is coming to meet '+n+'!';
  if(F.level===4) return n+' is almost ready for Adoption Day (Lv 5)!';
  if(m.hungry&&m.tired) return n+' is hungry AND tired. Rough day.';
  if(m.hungry) return n+"'s tummy is rumbling...";
  if(m.tired) return n+' is getting sleepy.';
  if(m.sad) return n+' looks bored. Playtime?';
  if(m.messy) return 'Someone left a mess in the backyard...';
  if(F.bond>70) return n+' adores you!';
  return n+' is happy to see you!';
}

/* ---------- cross-save export / import ----------
   The same HTML runs in a web browser and in the app,
   but each keeps its own storage. These functions move a save between them as
   plain text: export -> copy the code -> import -> paste it anywhere. */
var SAVE_VERSION = 1;
function exportSave(S){
  var payload = { app:'pupgotchi', v:SAVE_VERSION, at:Date.now(), state:S };
  var json = JSON.stringify(payload);
  // unicode-safe base64
  var b64 = (typeof btoa !== 'undefined')
    ? btoa(unescape(encodeURIComponent(json)))
    : Buffer.from(json, 'utf8').toString('base64');
  return 'PG1-' + b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function parseSave(str){
  if(!str || typeof str !== 'string') return { ok:false, error:'Empty code.' };
  var code = str.trim().replace(/^PG1-/, '');
  if(!code) return { ok:false, error:'Empty code.' };
  try{
    var b64 = code.replace(/-/g, '+').replace(/_/g, '/');
    while(b64.length % 4) b64 += '=';
    var json = (typeof atob !== 'undefined')
      ? decodeURIComponent(escape(atob(b64)))
      : Buffer.from(b64, 'base64').toString('utf8');
    var payload = JSON.parse(json);
    if(!payload || payload.app !== 'pupgotchi' || typeof payload.state !== 'object' || !payload.state)
      return { ok:false, error:'Not a Vegas Forever Homes save code.' };
    if(payload.v > SAVE_VERSION)
      return { ok:false, error:'This save is from a newer Vegas Forever Homes (v' + payload.v + '). Update first.' };
    var st = normalize(payload.state);
    var sf0=st.fosters&&st.fosters[0];
    if(!sf0 || typeof sf0.name !== 'string' || typeof sf0.breed !== 'string')
      return { ok:false, error:'Save data is corrupted.' };
    return { ok:true, state:st };
  }catch(e){
    return { ok:false, error:'Could not read that code. Check for typos.' };
  }
}

return {
  XP_LEVELS:XP_LEVELS, MAX_LEVEL:MAX_LEVEL, PRODUCTS:PRODUCTS, UPGRADES:UPGRADES, NAMES:NAMES, COATS:COATS,

/* Vegas Forever Homes - real-estate progression: properties with increasing dog caps.
 * Pure data + state helpers, DOM-free. */
var PG = window.PG || (window.PG = {});
PG.Props = (function(){
"use strict";

var DEFS=[
  {id:'backyard', name:'Backyard',            cost:0,     fosters:1, trainers:3,  half:8.5,
   desc:'Where it all started. Cozy and fenced.'},
  {id:'lot',     name:'Country Lot',         cost:1200,  fosters:2, trainers:4,  half:9.5,
   desc:'An open country lot with room to roam.'},
  {id:'ranch',   name:'Sunset Ranch',        cost:3000,  fosters:2, trainers:6,  half:10.5,
   desc:'A proper ranch. Bigger grounds, bigger pack.'},
  {id:'acres',   name:'Green Acres',         cost:6500,  fosters:3, trainers:8,  half:11.5,
   desc:'Rolling acres for three fosters at once.'},
  {id:'farm',    name:'Happy Tails Farm',    cost:13000, fosters:4, trainers:10, half:12.5,
   desc:'A working farm for a full house of happy tails.'},
  {id:'estate',  name:'Forever Homes Estate',cost:25000, fosters:5, trainers:12, half:13.5,
   desc:'The dream property. Five fosters, twelve trainers.'}
];

function def(id){
  for(var i=0;i<DEFS.length;i++) if(DEFS[i].id===id) return DEFS[i];
  return DEFS[0];
}
/* current property def for a state object */
function cur(S){ return def(ensure(S).current); }

/* make sure S.props is well-formed; migrates the old S.signs.barn once */
function ensure(S){
  if(!S.props||typeof S.props!=='object') S.props={};
  if(!Array.isArray(S.props.owned)||!S.props.owned.length) S.props.owned=['backyard'];
  if(typeof S.props.current!=='string'||!def(S.props.current)) S.props.current='backyard';
  if(S.props.owned.indexOf(S.props.current)<0) S.props.current=S.props.owned[0];
  if(!S.props.names||typeof S.props.names!=='object') S.props.names={};
  if(S.signs&&typeof S.signs.barn==='string'&&S.signs.barn&&!S.props.names.backyard)
    S.props.names.backyard=S.signs.barn;
  DEFS.forEach(function(d){
    if(typeof S.props.names[d.id]!=='string'||!S.props.names[d.id])
      S.props.names[d.id]='Vegas Forever Homes';
  });
  return S.props;
}

function owned(S,id){ return ensure(S).owned.indexOf(id)>=0; }

/* buy a property; returns {ok} or {ok:false,error} */
function buy(S,id){
  var d=def(id), p=ensure(S);
  if(p.owned.indexOf(id)>=0) return {ok:false,error:'Already owned.'};
  if(S.bones<d.cost) return {ok:false,error:'Need '+d.cost+' Bones.'};
  S.bones-=d.cost;
  p.owned.push(id);
  return {ok:true};
}

/* move to an owned property */
function move(S,id){
  var p=ensure(S);
  if(p.owned.indexOf(id)<0) return {ok:false,error:'Not owned yet.'};
  p.current=id;
  return {ok:true};
}

return { DEFS:DEFS, def:def, cur:cur, ensure:ensure, owned:owned, buy:buy, move:move };
})();

/* Vegas Forever Homes - shop: dog products (consumables) + backyard backgrounds. DOM module. */
var PG = window.PG || (window.PG = {});
PG.Shop = (function(){
"use strict";

var BGS=[
  {id:'auto',  name:'Auto (device time)', cost:0, desc:'Backyard follows your device clock: dawn, day, sunset, night.'},

function haveText(S,id){
  if(id==='kibble') return S.products.kibble>0 ? 'Have: '+S.products.kibble+' feeds' : '';
  if(id==='chew') return S.products.chew>0 ? 'Have: '+S.products.chew+' plays' : '';
  if(id==='blanket'){ var ms=(S.buffs.blanketUntil||0)-Date.now(); return ms>0 ? 'Active: '+Math.ceil(ms/3600000)+'h left' : ''; }
  if(id==='groom'){ var ms2=(S.buffs.groomUntil||0)-Date.now(); return ms2>0 ? 'Active: '+Math.ceil(ms2/3600000)+'h left' : ''; }
  if(id==='treats'){ var ms3=(S.buffs.treatsUntil||0)-Date.now(); return ms3>0 ? 'Active: '+Math.ceil(ms3/3600000)+'h left' : ''; }
  return '';
}

function renderPanel(container,S,onChange){
  container.innerHTML='';
  var st=document.createElement('style'); st.textContent=css(); container.appendChild(st);

  function section(title){
    var s=document.createElement('div'); s.className='pg-sec'; s.textContent=title;
    container.appendChild(s);
    var g=document.createElement('div'); g.className='pg-shop'; container.appendChild(g);
    return g;
  }
  function card(grid,nm,ds,have,btnText,btnCls,disabled,onClick){
    var c=document.createElement('div'); c.className='pg-item';
    c.innerHTML='<div class="nm"></div><div class="ds"></div>'+(have?'<div class="have"></div>':'');
    c.querySelector('.nm').textContent=nm;
    c.querySelector('.ds').textContent=ds;
    if(have) c.querySelector('.have').textContent=have;
    var by=document.createElement('div'); by.className='by';
    var b=document.createElement('button'); b.type='button'; b.className='pg-btn '+(btnCls||'');
    b.textContent=btnText; b.disabled=!!disabled;
    b.addEventListener('click',onClick);
    by.appendChild(b); c.appendChild(by); grid.appendChild(c);
  }

  // --- supplies ---
  var g1=section('SUPPLIES');
  PG.Care.PRODUCTS.forEach(function(p){
    card(g1,p.name,p.desc,haveText(S,p.id),p.cost+' Bones','acc',false,function(){
      var r=PG.Care.buyProduct(S,p.id,Date.now());
      PG.Care.setMsg(S,r.msg);
      onChange(r);
    });
  });

  // --- backyard upgrades (permanent tension sinks) ---
  var g3=section('BACKYARD UPGRADES');
  PG.Care.UPGRADES.forEach(function(u){
    var owned=!!S.upgrades[u.id];
    card(g3,u.name,u.desc,owned?'Installed':'',owned?'Installed':(u.cost+' Bones'),owned?'':'acc',owned,function(){
      var r=PG.Care.buyUpgrade(S,u.id,Date.now());
      PG.Care.setMsg(S,r.msg);
      onChange(r);
    });
  });

  // --- backyard ---
  var g2=section('BACKYARD');
  BGS.forEach(function(b){
    var cur=S.bg===b.id;
    card(g2,b.name,b.desc,'',cur?'Current':(b.cost?b.cost+' Bones':'Free'),cur?'':'acc',cur,function(){
      if(b.cost&&S.bones<b.cost){ var m='Not enough Bones ('+b.cost+'). Play Treat Match!'; PG.Care.setMsg(S,m); onChange({ok:false,msg:m}); return; }
      if(!cur&&b.cost){ S.bones-=b.cost; }
      S.bg=b.id; S.lastCare=Date.now();
      PG.Care.setMsg(S,b.name+' is now the backdrop.');
      onChange({ok:true,msg:b.name});
    });
  });
}

return {renderPanel:renderPanel};

/* ============================================================
 * Vegas Forever Homes — "Bone Crush" match-3 mini-game
 *
 * Self-contained Candy Crush-like. Plain script, no imports,
 * no external assets, no network. Works from file:// .
 *
 * Host contract:
 *   var game = PG.Match3.create(canvas, { onEnd: function(bones){} });
 *   game.start();            // (re)start a round
 *   // host runs its own rAF loop:
 *   game.update(dt);         // dt in seconds
 *   game.draw();
 *   game.destroy();          // removes listeners
 *   game.bonesEarned         // live bones count
 *   game.score, game.movesLeft
 *
 * Round = 25 moves. bonesEarned = 5 + floor(score/120) + crush bonuses
 * (clearing 4+ tiles in one shot: 4->+1, 5->+3, 6->+6, 7->+10, 8->+15...).
 * ============================================================ */
var PG = window.PG || (window.PG = {});
(function () {
'use strict';

/* ---------------- tuning ---------------- */
var N = 8;        // board is NxN
var TYPES = 6;    // tile types
var MOVES = 25;   // moves per round
var SWAP_DUR = 0.16, POP_DUR = 0.28, FALL_DUR = 0.32;

/* tile art: [chipColor, shapeColor] */
var TC = [
  ['#f3ead8', '#8d6e63'],  // 0 bone
  ['#d7e44a', '#ffffff'],  // 1 tennis ball
  ['#ffab91', '#5d4037'],  // 2 paw print
  ['#d7a86e', '#7a4a21'],  // 3 dog biscuit
  ['#ffb300', '#fffde7'],  // 4 star
  ['#e53935', '#ffffff']   // 5 fire hydrant
];

function tv(c) { return (c && typeof c === 'object') ? c.t : c; }
function rnd(n, rng) { return Math.floor((rng || Math.random)() * n); }
function bonesFor(score) { return 5 + Math.floor(score / 120); }
/* Bonus bones for clearing n tiles in a single shot (one doClear call).
 * 3 or fewer: no bonus. 4:+1, 5:+3, 6:+6, 7:+10, 8:+15, ... (triangular). */
function crushBonusFor(n) { return n <= 3 ? 0 : Math.floor((n - 3) * (n - 2) / 2); }

/* ---------------- pure board logic ----------------
 * All of these work on plain NxN arrays. Cells may be numbers
 * (tests) or {t, ...} tile objects (game) — tv() reads either.
 * Exposed as PG.Match3._pure for unit tests. */

function findMatches(g) {
  var runs = [], x, y, i;
  for (y = 0; y < N; y++) {                 // horizontal runs
    x = 0;
    while (x < N) {
      var t = tv(g[y][x]), len = 1;
      while (x + len < N && tv(g[y][x + len]) === t) len++;
      if (t >= 0 && len >= 3) {
        var cells = [];
        for (i = 0; i < len; i++) cells.push([x + i, y]);
        runs.push({ type: t, cells: cells });
      }
      x += len;
    }
  }
  for (x = 0; x < N; x++) {                 // vertical runs
    y = 0;
    while (y < N) {
      var t2 = tv(g[y][x]), len2 = 1;
      while (y + len2 < N && tv(g[y + len2][x]) === t2) len2++;
      if (t2 >= 0 && len2 >= 3) {
        var cells2 = [];
        for (i = 0; i < len2; i++) cells2.push([x, y + i]);
        runs.push({ type: t2, cells: cells2 });
      }
      y += len2;
    }
  }
  return runs;
}

function makeGrid(rng) {
  var g, x, y;
  for (var attempt = 0; attempt < 60; attempt++) {
    g = [];
    for (y = 0; y < N; y++) {
      g[y] = [];
      for (x = 0; x < N; x++) {
        var t, guard = 0;
        do {
          t = rnd(TYPES, rng); guard++;
        } while (guard < 60 &&
          ((x >= 2 && tv(g[y][x - 1]) === t && tv(g[y][x - 2]) === t) ||
           (y >= 2 && tv(g[y - 1][x]) === t && tv(g[y - 2][x]) === t)));
        g[y][x] = t;
      }
    }
    if (hasPossibleMove(g)) return g;
  }
  return g; // unreachable in practice
}

/* Which cells a set of runs clears, including specials.
 * cause = {type:'swap', x, y, tileType} | {type:'cascade'}
 *  - run of 4 -> clears that row AND column (anchor: swapped tile if in run)
 *  - run of 5 -> clears ALL tiles of the swapped tile's type */
function clearSetFor(g, runs, cause) {
  var cleared = {}, specials = [];
  function add(x, y) { cleared[x + ',' + y] = 1; }
  runs.forEach(function (run) {
    var len = run.cells.length, i, x, y;
    if (len >= 5) {
      var tt = (cause && cause.type === 'swap') ? cause.tileType : run.type;
      var sx = (cause && cause.type === 'swap') ? cause.x : run.cells[0][0];
      var sy = (cause && cause.type === 'swap') ? cause.y : run.cells[0][1];
      specials.push({ kind: 'alltype', type: tt, x: sx, y: sy });
      for (y = 0; y < N; y++) for (x = 0; x < N; x++)
        if (tv(g[y][x]) === tt) add(x, y);
    } else if (len === 4) {
      var ax, ay, m;
      if (cause && cause.type === 'swap' &&
          run.cells.some(function (c) { return c[0] === cause.x && c[1] === cause.y; })) {
        ax = cause.x; ay = cause.y;
      } else {
        m = run.cells[Math.floor(len / 2)]; ax = m[0]; ay = m[1];
      }
      specials.push({ kind: 'rowcol', x: ax, y: ay });
      for (x = 0; x < N; x++) add(x, ay);
      for (y = 0; y < N; y++) add(ax, y);
    } else {
      for (i = 0; i < len; i++) add(run.cells[i][0], run.cells[i][1]);
    }
  });
  return { cleared: cleared, specials: specials };
}

/* Remove cleared cells, drop survivors, spawn fresh tiles on top.
 * cleared: {"x,y":1} map. Mutates g. Returns falls: [{tile,x,fromY,toY}]
 * so the game can animate them (offsets are in cell units). */
function collapse(g, cleared, rng) {
  var falls = [], x, y;
  for (x = 0; x < N; x++) {
    var write = N - 1;
    for (y = N - 1; y >= 0; y--) {
      if (!cleared[x + ',' + y]) {
        var tile = g[y][x];
        if (write !== y) {
          g[write][x] = tile;
          falls.push({ tile: tile, x: x, fromY: y, toY: write });
        }
        write--;
      }
    }
    var need = write + 1;                    // fresh tiles needed
    for (y = write; y >= 0; y--) {
      var nt = { t: rnd(TYPES, rng), ox: 0, oy: 0, sc: 1, al: 1 };
      g[y][x] = nt;
      falls.push({ tile: nt, x: x, fromY: y - need, toY: y });
    }
  }
  return falls;
}

function hasPossibleMove(g) {
  var x, y, tmp;
  function swapOk() { return findMatches(g).length > 0; }
  for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
    if (x + 1 < N) {
      tmp = g[y][x]; g[y][x] = g[y][x + 1]; g[y][x + 1] = tmp;
      var r1 = swapOk();
      tmp = g[y][x]; g[y][x] = g[y][x + 1]; g[y][x + 1] = tmp;
      if (r1) return true;
    }
    if (y + 1 < N) {
      tmp = g[y][x]; g[y][x] = g[y + 1][x]; g[y + 1][x] = tmp;
      var r2 = swapOk();
      tmp = g[y][x]; g[y][x] = g[y + 1][x]; g[y + 1][x] = tmp;
      if (r2) return true;
    }
  }
  return false;
}

function wrapGrid(g) {                       // numbers -> tile objects
  return g.map(function (row) {
    return row.map(function (t) { return { t: t, ox: 0, oy: 0, sc: 1, al: 1 }; });
  });
}

/* ---------------- canvas helpers ---------------- */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* Draw one tile: colored chip + bold vector shape. (cx,cy) center,
 * r ~ half cell, sc scale, al alpha. No emoji anywhere. */
function drawTile(ctx, type, cx, cy, r, sc, al) {
  ctx.save();
  ctx.globalAlpha = al;
  ctx.translate(cx, cy);
  ctx.scale(sc, sc);
  rr(ctx, -r, -r, r * 2, r * 2, r * 0.35);
  ctx.fillStyle = TC[type][0];
  ctx.fill();
  var fg = TC[type][1];
  ctx.fillStyle = fg;
  ctx.strokeStyle = fg;
  var i;
  if (type === 0) {                          // bone
    var bw = r * 1.15, bh = r * 0.42;
    rr(ctx, -bw / 2, -bh / 2, bw, bh, bh / 2);
    ctx.fill();
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (s) {
      ctx.beginPath();
      ctx.arc(s[0] * bw / 2, s[1] * bh / 2, bh * 0.62, 0, 7);
      ctx.fill();
    });
  } else if (type === 1) {                   // tennis ball
    ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, 7); ctx.fill();
    ctx.strokeStyle = TC[1][0]; ctx.lineWidth = r * 0.14;
    ctx.beginPath(); ctx.arc(-r * 0.78, 0, r * 0.72, -1.1, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.78, 0, r * 0.72, Math.PI - 1.1, Math.PI + 1.1); ctx.stroke();
  } else if (type === 2) {                   // paw print
    ctx.beginPath();
    ctx.ellipse(0, r * 0.32, r * 0.52, r * 0.42, 0, 0, 7);
    ctx.fill();
    for (i = 0; i < 4; i++) {
      var tx = (i - 1.5) * r * 0.44;
      var ty = -r * 0.5 + Math.abs(i - 1.5) * r * 0.14;
      ctx.beginPath(); ctx.arc(tx, ty, r * 0.24, 0, 7); ctx.fill();
    }
  } else if (type === 3) {                   // dog biscuit
    rr(ctx, -r * 0.7, -r * 0.5, r * 1.4, r, r * 0.3);
    ctx.fill();
    ctx.fillStyle = TC[3][0];
    [-0.35, 0, 0.35].forEach(function (dx) {
      ctx.beginPath(); ctx.arc(dx * r, 0, r * 0.12, 0, 7); ctx.fill();
    });
  } else if (type === 4) {                   // star
    ctx.beginPath();
    for (i = 0; i < 10; i++) {
      var rad = (i % 2 === 0) ? r * 0.85 : r * 0.38;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  } else {                                   // 5 fire hydrant
    rr(ctx, -r * 0.42, -r * 0.45, r * 0.84, r * 0.95, r * 0.18); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -r * 0.45, r * 0.42, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -r * 0.95, r * 0.16, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-r * 0.56, -r * 0.1, r * 0.18, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.56, -r * 0.1, r * 0.18, 0, 7); ctx.fill();
    rr(ctx, -r * 0.55, r * 0.42, r * 1.1, r * 0.22, r * 0.1); ctx.fill();
  }
  ctx.restore();
}

/* ---------------- game instance ---------------- */
function Game(canvas, opts) {
  this.cv = canvas;
  this.ctx = canvas.getContext('2d');
  this.onEnd = (opts && opts.onEnd) || function () {};
  this.hudH = 52;
  this.time = 0;
  this.score = 0;
  this.movesLeft = MOVES;
  this.crushBonus = 0;   // bonus bones from big single-shot crushes
  this.bonesEarned = bonesFor(0);
  this.grid = null;
  this.sel = null;
  this.phase = 'idle';       // idle | ready | busy | over
  this.tweens = [];
  this.flashes = [];
  this.msg = null;
  this.msgT = 0;
  this.combo = 1;
  this.hint = true;
  this.ended = false;
  canvas.style.touchAction = 'pan-y'; // taps swap tiles; vertical drags scroll the page
  var self = this;
  this._pd = function (e) { self.onDown(e); };
  canvas.addEventListener('pointerdown', this._pd);
}

Game.prototype.destroy = function () {
  this.cv.removeEventListener('pointerdown', this._pd);
  this.tweens = [];
  this.flashes = [];
};

Game.prototype.start = function () {
  this.grid = wrapGrid(makeGrid());
  this.sel = null;
  this.score = 0;
  this.movesLeft = MOVES;
  this.crushBonus = 0;
  this.bonesEarned = bonesFor(0);
  this.combo = 1;
  this.tweens = [];
  this.flashes = [];
  this.msg = null; this.msgT = 0;
  this.hint = true;
  this.ended = false;
  this.phase = 'ready';
};

Game.prototype.tween = function (dur, fn, done) {
  this.tweens.push({ t: 0, dur: dur, fn: fn, done: done || null });
};

Game.prototype.layout = function () {
  var w = this.cv.clientWidth || 320, h = this.cv.clientHeight || 420;
  var top = this.hudH;
  var size = Math.min(w, h - top - 8);
  var cell = size / N;
  return {
    w: w, h: h, cell: cell, size: size,
    ox: (w - size) / 2,
    oy: top + Math.max(0, (h - top - size) / 2)
  };
};

Game.prototype.onDown = function (e) {
  if (this.phase !== 'ready' || this.ended || !this.grid) return;
  var r = this.cv.getBoundingClientRect();
  var px = e.clientX - r.left, py = e.clientY - r.top;
  var L = this.layout();
  var x = Math.floor((px - L.ox) / L.cell);
  var y = Math.floor((py - L.oy) / L.cell);
  if (x < 0 || x >= N || y < 0 || y >= N) { this.sel = null; return; }
  if (!this.sel) { this.sel = { x: x, y: y }; return; }
  var dx = Math.abs(x - this.sel.x), dy = Math.abs(y - this.sel.y);
  if (dx + dy === 1) {
    var s = this.sel; this.sel = null;
    this.trySwap(s.x, s.y, x, y);
  } else if (dx === 0 && dy === 0) {
    this.sel = null;                          // tap selected again = deselect
  } else {
    this.sel = { x: x, y: y };                // jump selection
  }
};

Game.prototype.trySwap = function (x1, y1, x2, y2) {
  if (this.phase !== 'ready' || this.ended) return;
  this.hint = false;
  var self = this, g = this.grid;
  var a = g[y1][x1], b = g[y2][x2];
  g[y1][x1] = b; g[y2][x2] = a;
  this.phase = 'busy';
  this.tween(SWAP_DUR, function (k) {
    var j = 1 - k;
    a.ox = (x1 - x2) * j; a.oy = (y1 - y2) * j;
    b.ox = (x2 - x1) * j; b.oy = (y2 - y1) * j;
  }, function () {
    a.ox = 0; a.oy = 0; b.ox = 0; b.oy = 0;
    var runs = findMatches(g);
    if (!runs.length) {                       // no match: swap back, free
      g[y1][x1] = a; g[y2][x2] = b;
      self.tween(SWAP_DUR, function (k) {
        var j = 1 - k;
        a.ox = (x2 - x1) * j; a.oy = (y2 - y1) * j;
        b.ox = (x1 - x2) * j; b.oy = (y1 - y2) * j;
      }, function () {
        a.ox = 0; a.oy = 0; b.ox = 0; b.oy = 0;
        self.phase = 'ready';
      });
    } else {
      self.movesLeft--;
      self.combo = 1;
      self.doClear(runs, { type: 'swap', x: x2, y: y2, tileType: tv(a) });
    }
  });
};

Game.prototype.doClear = function (runs, cause) {
  var self = this;
  var res = clearSetFor(this.grid, runs, cause);
  var tiles = [];
  for (var key in res.cleared) {
    var p = key.split(',');
    tiles.push(this.grid[+p[1]][+p[0]]);
  }
  res.specials.forEach(function (sp) {
    self.flashes.push({ kind: sp.kind === 'rowcol' ? 'rowcol' : 'ring',
                        x: sp.x, y: sp.y, t: 0, dur: 0.5 });
  });
  this.score += tiles.length * 10 * this.combo;
  // CRUSH BONUS: more tiles cleared in one shot = bonus bones, escalating.
  var _cb = crushBonusFor(tiles.length);
  if (_cb > 0) {
    this.crushBonus += _cb;
    this.msg = 'CRUSH BONUS +' + _cb + ' bones!';
    this.msgT = 1.6;
  }
  this.bonesEarned = bonesFor(this.score) + this.crushBonus;
  this.tween(POP_DUR, function (k) {
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].sc = 1 - k; tiles[i].al = 1 - k;
    }
  }, function () {
    var falls = collapse(self.grid, res.cleared);
    falls.forEach(function (f) { f.tile.oy = f.fromY - f.toY; });
    self.tween(FALL_DUR, function (k) {
      for (var i = 0; i < falls.length; i++) {
        falls[i].tile.oy = (falls[i].fromY - falls[i].toY) * (1 - k);
      }
    }, function () {
      falls.forEach(function (f) { f.tile.oy = 0; });
      var again = findMatches(self.grid);
      if (again.length) {                     // cascade: combo climbs
        self.combo++;
        self.doClear(again, { type: 'cascade' });
      } else {
        self.afterSettle();
      }
    });
  });
};

Game.prototype.afterSettle = function () {
  if (!hasPossibleMove(this.grid)) {
    this.grid = wrapGrid(makeGrid());
    this.msg = 'No moves left — board shuffled!';
    this.msgT = 1.8;
  }
  if (this.movesLeft <= 0) this.finish();
  else this.phase = 'ready';
};

Game.prototype.finish = function () {
  this.phase = 'over';
  if (!this.ended) {                          // exactly once
    this.ended = true;
    this.onEnd(this.bonesEarned);
  }
};

Game.prototype.update = function (dt) {

function el(tag, cls, text) {
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  return d;
}


/* Tap handler that survives flaky tap-to-click in mobile WebViews: accept
   pointerup as well as click, ignore scroll gestures and double-fires. */
function onTap(btn, fn) {
  var last = 0, dx = 0, dy = 0;
  btn.addEventListener('pointerdown', function (e) { dx = e.clientX || 0; dy = e.clientY || 0; });
  function fire(e) {
    var cx = (e && e.clientX) || 0, cy = (e && e.clientY) || 0;
    if (Math.abs(cx - dx) > 14 || Math.abs(cy - dy) > 14) return; // it was a scroll
    var t = Date.now();
    if (t - last < 600) return;
    last = t;
    fn();
  }
  btn.addEventListener('pointerup', fire);
  btn.addEventListener('click', fire);
}

/* Stepped onboarding: one question at a time. Step 1 = breed, Step 2 = coat.
   The dog keeps its shelter name; renaming happens later from the Foster tab. */
function renderWizard(container, current, onDone, opts) {
  container.innerHTML = '';
  injectCss();
  opts = opts || {};
  current = current || {};
  var breeds = PG.BREEDS || {};
  var keys = Object.keys(breeds);
  var step = 1;
  var selBreed = (current.breed && breeds[current.breed]) ? current.breed : keys[0];
  var selPat = 0;
  var fur = current.fur || '#a9805a', belly = current.belly || '#d9bd93',
      mark = current.mark || '#6b4e33', patName = '', patFx = null;

  function patterns() { return COATS[selBreed] || []; }
  function applyPat() {
    var list = patterns();
    var p = list[selPat] || list[0] || ['Custom', fur, belly, mark];
    patName = p[0]; fur = p[1]; belly = p[2]; mark = p[3]; patFx = p[4]||null;
  }

  var wrap = el('div', 'pg-md');
  container.appendChild(wrap);

  function breedStep(parent) {
    parent.appendChild(el('p', 'pg-md-step', 'STEP 1 OF 2'));
    parent.appendChild(el('h2', 'pg-md-title', 'Which breed?'));
    parent.appendChild(el('p', 'pg-md-sub', 'Pick the breed of your new foster.'));
    var grid = el('div', 'pg-md-breeds');
    var btns = {};
    keys.forEach(function (k) {
      var b = el('button', 'pg-md-breed' + (k === selBreed ? ' sel' : ''), (breeds[k] && breeds[k].label) || k);
      b.type = 'button';
      b.setAttribute('aria-pressed', k === selBreed ? 'true' : 'false');
      onTap(b, function () {
        selBreed = k; selPat = 0;
        keys.forEach(function (kk) {
          btns[kk].classList.toggle('sel', kk === k);
          btns[kk].setAttribute('aria-pressed', kk === k ? 'true' : 'false');
        });
        factLine.textContent = (breeds[selBreed] && breeds[selBreed].fact) || '';
      });
      btns[k] = b;
      grid.appendChild(b);
    });
    parent.appendChild(grid);
    var factLine = el('p', 'pg-md-fact', (breeds[selBreed] && breeds[selBreed].fact) || '');
    parent.appendChild(factLine);
    var rnd = el('button', 'pg-md-random', '\u2728 Surprise me');
    rnd.type = 'button';
    onTap(rnd, function () {
      selBreed = keys[(Math.random() * keys.length) | 0];
      var list = patterns();
      selPat = list.length ? ((Math.random() * list.length) | 0) : 0;
      applyPat();
      step = 2; render();
    });
    parent.appendChild(rnd);
    var next = el('button', 'pg-md-confirm', 'Next: pick a coat \u2192');
    next.type = 'button';
    onTap(next, function () { applyPat(); step = 2; render(); });
    parent.appendChild(next);
  }

  function coatStep(parent) {
    applyPat();
    parent.appendChild(el('p', 'pg-md-step', 'STEP 2 OF 2'));
    parent.appendChild(el('h2', 'pg-md-title', 'Which coat?'));
    parent.appendChild(el('p', 'pg-md-sub', ((breeds[selBreed] && breeds[selBreed].label) || selBreed) + ' coats \u2014 pick one.'));
    var grid = el('div', 'pg-md-pats');
    patterns().forEach(function (p, i) {
      var b = el('button', 'pg-md-pat' + (i === selPat ? ' sel' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', i === selPat ? 'true' : 'false');
      var dots = el('span', 'pg-md-pdots');
      [p[1], p[2], p[3]].forEach(function (c) {
        var d = el('span', 'pg-md-pdot');
        d.style.background = c;
        dots.appendChild(d);
      });
      b.appendChild(dots);
      b.appendChild(el('span', null, p[0]));
      onTap(b, function () {
        selPat = i; applyPat();
        Array.prototype.forEach.call(grid.children, function (ch, j) {
          ch.classList.toggle('sel', j === i);
          ch.setAttribute('aria-pressed', j === i ? 'true' : 'false');
        });
      });
      grid.appendChild(b);
    });
    parent.appendChild(grid);
    var row = el('div', 'pg-md-row');
    var back = el('button', 'pg-md-back', '\u2190 Back');
    back.type = 'button';
    onTap(back, function () { step = 1; render(); });
    var go = el('button', 'pg-md-confirm', opts.cta || 'Start fostering!');
    go.type = 'button';
    onTap(go, function () {
      applyPat();
      onDone({ breed: selBreed, fur: fur, belly: belly, mark: mark, pattern: patName, coatFx: patFx });
    });
    row.appendChild(back); row.appendChild(go);
    parent.appendChild(row);
  }

  function render() {
    wrap.innerHTML = '';
    if (step === 1) breedStep(wrap); else coatStep(wrap);
  }
  render();
}

function renderPanel(container, current, onDone, opts) {
  container.innerHTML = '';
  injectCss();
  opts = opts || {};
  current = current || {};
  var breeds = PG.BREEDS || {};
  var keys = Object.keys(breeds);
  var prof = {
    breed: (current.breed && breeds[current.breed]) ? current.breed : (keys[0] || 'lab'),
    pat: 0, fur: '#a9805a', belly: '#d9bd93', mark: '#6b4e33'
  };

  function applyPattern() {
    var list = COATS[prof.breed] || [];
    var p = list[prof.pat] || list[0] || ['Custom', prof.fur, prof.belly, prof.mark];
    prof.patName = p[0]; prof.fur = p[1]; prof.belly = p[2]; prof.mark = p[3]; prof.patFx = p[4]||null;
  }
  // keep the foster\u2019s current colors selected when reopening the panel
  (function matchCurrent() {
    var list = COATS[prof.breed] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i][1] === current.fur && list[i][2] === current.belly) { prof.pat = i; break; }
    }
  })();
  applyPattern();

  var wrap = el('div', 'pg-md');
  wrap.appendChild(el('h2', 'pg-md-title', opts.title || 'Meet your pup'));
  var sub = el('p', 'pg-md-sub', opts.sub || 'Pick a breed, then choose a coat pattern.');
  wrap.appendChild(sub);

  /* breed grid */
  wrap.appendChild(el('div', 'pg-md-label', 'Breed'));
  var grid = el('div', 'pg-md-breeds');
  var breedBtns = {};
  keys.forEach(function (k) {
    var b = el('button', 'pg-md-breed' + (k === prof.breed ? ' sel' : ''), (breeds[k] && breeds[k].label) || k);
    b.type = 'button';
    b.setAttribute('aria-pressed', k === prof.breed ? 'true' : 'false');
    onTap(b, function () {
      prof.breed = k;
      prof.pat = 0;
      applyPattern();
      keys.forEach(function (kk) {
        breedBtns[kk].classList.toggle('sel', kk === k);
        breedBtns[kk].setAttribute('aria-pressed', kk === k ? 'true' : 'false');
      });
      factLine.textContent = (breeds[prof.breed] && breeds[prof.breed].fact) || '';
      renderPatterns();
    });
    breedBtns[k] = b;
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  var factLine = el('p', 'pg-md-fact', (breeds[prof.breed] && breeds[prof.breed].fact) || '');
  wrap.appendChild(factLine);

  /* per-breed coat pattern palettes */
  wrap.appendChild(el('div', 'pg-md-label', 'Coat pattern'));
  var patGrid = el('div', 'pg-md-pats');
  wrap.appendChild(patGrid);
  function renderPatterns() {
    patGrid.innerHTML = '';
    var list = COATS[prof.breed] || [];
    list.forEach(function (p, i) {
      var b = el('button', 'pg-md-pat' + (i === prof.pat ? ' sel' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', i === prof.pat ? 'true' : 'false');
      var dots = el('span', 'pg-md-pdots');
      [p[1], p[2], p[3]].forEach(function (c) {
        var d = el('span', 'pg-md-pdot');
        d.style.background = c;
        dots.appendChild(d);
      });
      b.appendChild(dots);
      b.appendChild(el('span', null, p[0]));
      onTap(b, function () {
        prof.pat = i;
        applyPattern();
        renderPatterns();
      });
      patGrid.appendChild(b);
    });
  }
  renderPatterns();

  /* surprise me: random breed + pattern */
  var rndBtn = el('button', 'pg-md-random', '\u2728 Surprise me');
  rndBtn.type = 'button';
  onTap(rndBtn, function () {
    prof.breed = keys[(Math.random() * keys.length) | 0];
    var list = COATS[prof.breed] || [];
    prof.pat = (Math.random() * list.length) | 0;
    applyPattern();
    keys.forEach(function (kk) {
      breedBtns[kk].classList.toggle('sel', kk === prof.breed);
      breedBtns[kk].setAttribute('aria-pressed', kk === prof.breed ? 'true' : 'false');
    });
    renderPatterns();
  });
  wrap.appendChild(rndBtn);

  /* confirm */
  var confirm = el('button', 'pg-md-confirm', opts.cta || 'Start caring!');
  confirm.type = 'button';
  onTap(confirm, function () {
    onDone({ breed: prof.breed, fur: prof.fur, belly: prof.belly, mark: prof.mark, pattern: prof.patName, coatFx: prof.patFx });
  });
  wrap.appendChild(confirm);

  container.appendChild(wrap);
}

/* ============================================================
 * Vegas Forever Homes — web-only auto-save shim (localStorage).
 *
 * IMPORTANT: this file is included ONLY in the standalone browser
 * build (pupgotchi-web.html). It is deliberately excluded from the
 * widget build (pupgotchi.html): the widget build persists via
 * the hatch bridge instead, and the widget validator rejects
 * localStorage outright.
 *
 * main.js calls PG.WebSave only when there is no bridge, so this
 * never activates inside the widget even if it were included.
 * ============================================================ */
var PG = window.PG || (window.PG = {});
(function () {
'use strict';
var KEY = 'vegasforeverhomes.save.v1';
var OLD_KEY = 'pupgotchi.save.v1'; // pre-rename; migrated on first load
function ls() { try { return window.localStorage || null; } catch (e) { return null; } }
function parse(raw) {
  try {
    var o = JSON.parse(raw);
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : null;
  } catch (e) { return null; }
}
PG.WebSave = {
  load: function () {
    try {
      var s = ls();
      if (!s) return null;
      var o = parse(s.getItem(KEY));
      if (o) return o;
      // migrate the pre-rename save once
      o = parse(s.getItem(OLD_KEY));
      if (o) {
        try { s.setItem(KEY, JSON.stringify(o)); s.removeItem(OLD_KEY); } catch (e) {}
      }
      return o;
    } catch (e) { return null; }
  },
  save: function (state) {
    var s = ls();
    if (!s) return;
    try { s.setItem(KEY, JSON.stringify(state)); } catch (e) { /* quota/private mode: ignore */ }
  },
  clear: function () {
    var s = ls();
    if (!s) return;
    try { s.removeItem(KEY); } catch (e) {}
  }
};
})();

/* Vegas Forever Homes - main app shell: foster loop, bridge, 3D loop, UI wiring. Loaded last. */
(function(){
"use strict";
var root=(document.currentScript&&document.currentScript.parentElement)||document;
function q(s){ return root.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(root.querySelectorAll(s)); }
var bridge=window.hatchWidget||null;

var DEF=PG.Care.defaults();
var _webSave=(!bridge&&PG.WebSave)?PG.WebSave.load():null;
var S=PG.Care.normalize(Object.assign({},DEF,bridge?bridge.getState(DEF):{},_webSave||{}));
PG.Props.ensure(S); // real-estate state
if(!bridge && /demo/.test(window.location.search||'')){
  var _dfs=PG.Care.sel(S);
  _dfs.name='Luna'; S.bones=120;
  var _bm=/breed=([a-z]+)/.exec(window.location.search||'');
  if(_bm&&PG.BREEDS[_bm[1]]) _dfs.breed=_bm[1];
  else { _dfs.breed='pitbull'; _dfs.fur='#f4f1e8'; _dfs.belly='#faf8f0'; _dfs.mark='#9a7a4e';
         _dfs.coatFx={spot:'rump', ears:'fur', tail:'fur'}; }
  if(/pack/.test(window.location.search||'')){ // demo: full pack to show kennel housing
    S.fosters.push(PG.Care.newFoster());
    S.residents.push({name:'Rex',breed:'lab',fur:'#c8955c',belly:'#e8d3ae',mark:'#8a5a2e',level:3,xp:0,coatFx:null});
  }
}
/* selected foster shorthand */
function F(){ return PG.Care.sel(S); }
/* the 3D dog object for the selected foster */
function selDog(){
  var f=F();
  for(var i=0;i<dogs.length;i++) if(dogs[i]._foster===f) return dogs[i];
  return dogs[0]||null;
}
var _saveSeq=0;
function save(){
  _saveSeq++;
  try{ S._saveSeq=_saveSeq; }catch(e){}
  if(bridge) bridge.setState(S);
  else if(PG.WebSave) PG.WebSave.save(S); // standalone browser auto-save
}
function rnd(a,b){ return a+Math.random()*(b-a); }

/* ---------- world: foster dogs + resident trainers ---------- */
function propHalf(){ return PG.Props.cur(S).half; }
var yard=PG.Yard.create(propHalf());
S.fosters.forEach(function(f){ for(var pi=0;pi<f.poop;pi++) PG.Yard.addPoop(yard,rnd(-4,4),rnd(-4,4)); });

var dogs=[]; // dogs[0..n-1] = fosters (in S.fosters order), rest = resident trainers
function rebuildDogs(){
  dogs=[];
  S.fosters.forEach(function(f){
    var d=PG.Dog.create({name:f.name,breed:f.breed,fur:f.fur,belly:f.belly,mark:f.mark,level:f.level,coatFx:f.coatFx});
    d._foster=f;
    d.pos=[rnd(-3,3),0,rnd(-3,3)];
    dogs.push(d);
  });
  S.residents.forEach(function(r){
    var d=PG.Dog.create({name:r.name,breed:r.breed,fur:r.fur,belly:r.belly,mark:r.mark,level:r.level,coatFx:r.coatFx});
    d.pos=[rnd(-3,3),0,rnd(-3,3)];
    dogs.push(d);
  });
  S.fosters.forEach(function(f,i){
    var d=dogs[i]; if(!d) return;
    if(f.sick) PG.Dog.setAction(d,'sick',yard);
    if(f.sleeping) PG.Dog.setAction(d,'sleep',yard);
  });
  var d0=selDog();
  if(!bridge && /closeup/.test(window.location.search||'')){
    d0.pos=[0,0,2.8]; d0.yaw=0; d0.mode='idle'; d0.modeT=99999; d0.target=null;
    var _am=/act=([a-z]+)/.exec(window.location.search||'');
    if(_am&&/^(eat|play|sleep|sick|celebrate|sit)$/.test(_am[1])){
      if(_am[1]==='sit'){ d0.mode='sit'; }
      else PG.Dog.setAction(d0,_am[1],yard,{});
      d0.modeT=99999; d0.hopT=_am[1]==='play'?0.5:-1;
    }
  }

}

/* housing: the selected foster trains free in the yard; every other dog
 * kennels in the kennel block unless the pack was let out to play. */
function applyHousing(){
  if(typeof PG.Yard.cageSpots!=='function') return;
  var spots=PG.Yard.cageSpots(yard.H), qi=0, self=F();
  for(var i=0;i<dogs.length;i++){
    var d=dogs[i];
    if(d.sleeping||d.sick||d.mode==='eat'||d.mode==='sleep') continue;
    var isSel=d._foster&&d._foster===self;
    if(!S.freeRoam && !isSel && qi<spots.length){
      d.caged=true;
      d.pos=[spots[qi][0],0,spots[qi][1]];
      d.yaw=0; d.target=null; d.speed=0;
      d.mode='sit'; d.modeT=2.5; d.headYaw=0; d.headPitch=0;
      qi++;
    }else if(d.caged){
      d.caged=false; d.mode='idle'; d.modeT=1; d.target=null;
    }
  }
}

var starSeed=[];
for(var si=0;si<70;si++) starSeed.push({x:Math.random(),y:Math.random()*0.55,r:rnd(0.6,1.8),tw:rnd(0,6)});
// oil-paint sky dabs: static soft horizontal brush strokes
var skySeed=[];
(function(){ var s=12345; function R(){ s=(s*1664525+1013904223)|0; return ((s>>>9)%10000)/10000; }
  for(var i=0;i<16;i++) skySeed.push({x:R(),y:R()*0.6,w:30+R()*70,h:8+R()*14,
    c:['#7cc4f7','#8fd0fa','#a5dcfc','#6fbdf3'][(R()*4)|0], a:0.25+R()*0.3});
})();
// canvas grain tile for the oil-paint finish (built once at boot)
var grainTile=null;
function buildGrain(){
  var c=document.createElement('canvas'); c.width=c.height=128;
  var g=c.getContext('2d'), im=g.createImageData(128,128);
  for(var i=0;i<im.data.length;i+=4){
    var v=110+Math.random()*36;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  g.putImageData(im,0,0);
  grainTile=c;
}
function drawGrain(){
  if(!grainTile) buildGrain();

/* ---------- device-time sky ---------- */
/* ?hour=HH test hook (e.g. ?hour=21.5) forces the yard clock for screenshots. */
var _hourOverride=null;
(function(){ try{
  var m=/[?&]hour=([0-9.]+)/.exec(window.location.search||'');
  if(m) _hourOverride=parseFloat(m[1]);
}catch(e){} })();
function yardHour(){

  return (PG.DayNight?PG.DayNight.deviceHour():12);

var _skyDarken=0; // ambient night overlay, set by drawSky each frame

function drawSky(t){
  var g, i, s;
  _skyDarken=0;
  if(S.bg==='auto'&&PG.DayNight){
    var dn=PG.DayNight.at(yardHour());
    _skyDarken=dn.darken;
    g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,dn.top); g.addColorStop(0.55,dn.mid); g.addColorStop(1,dn.bot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(dn.stars>0.01){
      /* Static stars (no twinkle): twinkling read as flicker on mobile GPUs.
       * fillRect is cheaper than arc; globalAlpha avoids string concat. */
      ctx.fillStyle='#fff'; ctx.globalAlpha=dn.stars;
      for(i=0;i<starSeed.length;i++){ s=starSeed[i];
        ctx.fillRect(s.x*W,s.y*H,s.r*2,s.r*2); }
      ctx.globalAlpha=1;
    }
    if(dn.sun>0.01){
      ctx.globalAlpha=dn.sun;
      ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(W*0.82,H*0.2,30,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
    if(dn.moon>0.01){
      ctx.globalAlpha=dn.moon;
      ctx.fillStyle='#f4f1de'; ctx.beginPath(); ctx.arc(W*0.8,H*0.2,26,0,7); ctx.fill();
      ctx.fillStyle='#d8d4c0'; ctx.beginPath(); ctx.arc(W*0.8-9,H*0.2-5,6,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
    // dabbed clouds, fading as night falls
    var dayA=Math.max(0,1-dn.darken*1.6);
    if(dayA>0.03){
      ctx.globalAlpha=dayA*0.85; ctx.fillStyle='#ffffff';
      [[0.2,0.18,46],[0.62,0.12,40]].forEach(function(c){
        var cx=c[0]*W+Math.sin(t*0.2)*8, cy=c[1]*H;
        ctx.beginPath(); ctx.ellipse(cx-c[2]*0.5,cy+6,c[2]*0.55,c[2]*0.32,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx,cy,c[2],c[2]*0.45,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+c[2]*0.5,cy+7,c[2]*0.5,c[2]*0.3,0,0,7); ctx.fill();
      });
      ctx.globalAlpha=1;
    }
    return;
  }
  if(S.bg==='sunset'){
    g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#3b2d5c'); g.addColorStop(0.55,'#c65b3f'); g.addColorStop(1,'#f7b267');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffdf8a'; ctx.beginPath(); ctx.arc(W*0.72,H*0.62,34,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,223,138,.35)'; ctx.beginPath(); ctx.arc(W*0.72,H*0.62,52,0,7); ctx.fill();
  } else if(S.bg==='night'){
    g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0b1026'); g.addColorStop(1,'#23365e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    for(var i=0;i<starSeed.length;i++){ var s=starSeed[i];
      ctx.fillRect(s.x*W,s.y*H,s.r*2,s.r*2); }
    ctx.fillStyle='#f4f1de'; ctx.beginPath(); ctx.arc(W*0.8,H*0.2,26,0,7); ctx.fill();
    ctx.fillStyle='#d8d4c0'; ctx.beginPath(); ctx.arc(W*0.8-9,H*0.2-5,6,0,7); ctx.fill();
  } else {
    g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#6ec1f5'); g.addColorStop(1,'#d8f0fc');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // oil-paint sky: layered horizontal dabs
    for(var sdi=0;sdi<skySeed.length;sdi++){ var sd=skySeed[sdi];
      ctx.globalAlpha=sd.a; ctx.fillStyle=sd.c;
      ctx.beginPath(); ctx.ellipse(sd.x*W+Math.sin(t*0.15+sdi)*6, sd.y*H, sd.w, sd.h, 0, 0, 7); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(W*0.82,H*0.2,30,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    // dabbed clouds: clusters of overlapping ellipses
    [[0.2,0.18,46],[0.62,0.12,40]].forEach(function(c){
      var cx=c[0]*W+Math.sin(t*0.2)*8, cy=c[1]*H;
      ctx.beginPath(); ctx.ellipse(cx-c[2]*0.5,cy+6,c[2]*0.55,c[2]*0.32,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx,cy,c[2],c[2]*0.45,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+c[2]*0.5,cy+7,c[2]*0.5,c[2]*0.3,0,0,7); ctx.fill();
    });
  }
}

function drawFx(dt,t){
  // sleep Z's above every sleeping foster dog
  for(var _dzi=0;_dzi<S.fosters.length;_dzi++){
    var _dd=dogs[_dzi]; if(!_dd) continue;
    if(_dd.sleeping||_dd.mode==='sleep'){
      var hp=PG.E3D.project([_dd.pos[0],2.5,_dd.pos[2]],cam,W,H);
      if(hp){
        ctx.fillStyle='#fff'; ctx.font='bold 22px system-ui';
        for(var i=0;i<3;i++){
          var ph=(t*0.5+i*0.33+_dzi*0.2)%1;
          ctx.globalAlpha=1-ph;
          ctx.fillText('Z', hp[0]+10+i*16, hp[1]-ph*46);
        }
        ctx.globalAlpha=1;
      }
    }
  }
  for(var i=sparks.length-1;i>=0;i--){
    var p=sparks[i]; p.t+=dt;
    if(p.t>p.life){ sparks.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=4*dt;
    var sp=PG.E3D.project([p.x,p.y,p.z],cam,W,H);
    if(!sp) continue;
    ctx.globalAlpha=1-p.t/p.life;
    ctx.fillStyle='#ffd93d';
    ctx.beginPath(); ctx.arc(sp[0],sp[1],3.5,0,7); ctx.fill();
  }
  // floating hearts from play dates
  ctx.font='bold 18px system-ui';
  for(var h=hearts.length-1;h>=0;h--){
    var hp2=hearts[h]; hp2.t+=dt;
    if(hp2.t>hp2.life){ hearts.splice(h,1); continue; }
    hp2.y+=hp2.vy*dt;
    var hp=PG.E3D.project([hp2.x,hp2.y,hp2.z],cam,W,H);
    if(!hp) continue;
    ctx.globalAlpha=1-hp2.t/hp2.life;
    ctx.fillStyle='#ff6b81';
    ctx.fillText('♥',hp[0]-7,hp[1]);
  }
  ctx.globalAlpha=1;
  /* property signs (barn etc.): player-nameable, billboarded at the board */
  try{
    var _sdefs=PG.Yard.signDefs?PG.Yard.signDefs(yard.H):[];
    for(var _si=0;_si<_sdefs.length;_si++){
      var _sd=_sdefs[_si];
      // barn sign shows the current property's custom name
      var _txt=(_sd.id==='barn')?(S.props.names[S.props.current]||''):(S.signs&&S.signs[_sd.id])||'';
      if(!_txt) continue;
      var _sp=PG.E3D.project(_sd.at,cam,W,H);
      if(!_sp) continue;
      var _ppu=(H/2)/Math.tan(cam.fov/2)/_sp[2];   // px per world unit at sign depth
      var _bw=_sd.w*_ppu;
      var _fs=Math.min(24,_bw/(_txt.length*0.58));
      _fs=Math.max(9,Math.min(24,_fs));
      ctx.font='800 '+_fs.toFixed(0)+'px system-ui,sans-serif';
      var _tw=ctx.measureText(_txt).width;
      if(_tw>_bw*0.9){ _fs=Math.max(9,_fs*_bw*0.9/_tw); ctx.font='800 '+_fs.toFixed(0)+'px system-ui,sans-serif'; }
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba(0,0,0,.5)';
      ctx.fillText(_txt,_sp[0]+1,_sp[1]+1);
      ctx.fillStyle='#f7ecd0';
      ctx.fillText(_txt,_sp[0],_sp[1]);
      ctx.textAlign='start'; ctx.textBaseline='alphabetic';
    }
  }catch(_se){}
  drawGrain(); // oil-paint canvas finish over the whole stage
}

var lastT=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  var t=now/1000;
  var mood=PG.Care.moodOf(S);
  for(var i=0;i<dogs.length;i++) PG.Dog.update(dogs[i],dt,yard,mood);
  separateDogs(dogs);
  socialMoments(dogs);
  if(curGame) curGame.update(dt);
  drawSky(t);
  var parts=PG.Yard.parts(yard,t);
  for(var j=0;j<dogs.length;j++) parts=parts.concat(PG.Dog.parts(dogs[j]));
  // ground layer first (huge faces break painter-sort otherwise -> dog clips through)
  var gp=[], op=[];
  for(var k=0;k<parts.length;k++){ if(parts[k].ground) gp.push(parts[k]); else op.push(parts[k]); }
  PG.E3D.render(ctx,cam,gp,W,H);
  PG.E3D.render(ctx,cam,op,W,H);
  drawFx(dt,t);
  if(_skyDarken>0.01){ // device-time night: dim the whole yard, dogs included
    ctx.fillStyle='rgba(6,8,20,'+_skyDarken.toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(curGame) curGame.draw();
  requestAnimationFrame(frame);
}

/* ---------- pack life: separation + play dates ---------- */
/* keep dogs from walking through each other */
function separateDogs(dogs){
  for(var a=0;a<dogs.length;a++) for(var b=a+1;b<dogs.length;b++){
    var da=dogs[a], db=dogs[b];
    var dx=db.pos[0]-da.pos[0], dz=db.pos[2]-da.pos[2];
    var dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<0.9&&dist>0.0001){
      var push=(0.9-dist)/2, nx=dx/dist, nz=dz/dist;
      da.pos[0]-=nx*push; da.pos[2]-=nz*push;
      db.pos[0]+=nx*push; db.pos[2]+=nz*push;
    }
  }
}
/* emergent social mechanic: when the foster bumps into a free Trainer, they play together */
var socCd={};
function socialMoments(dogs){
  if(dogs.length<2) return;
  var d0=selDog(), nowMs=Date.now();
  if(!d0) return;
  for(var i=0;i<dogs.length;i++){
    if(dogs[i]===d0) continue;
    var tr=dogs[i], key='s'+i;
    var dx=tr.pos[0]-d0.pos[0], dz=tr.pos[2]-d0.pos[2];
    if(Math.sqrt(dx*dx+dz*dz)>1.4) continue;
    if(!PG.Dog.canSocialize(d0)||!PG.Dog.canSocialize(tr)) continue;
    if(socCd[key]&&nowMs<socCd[key]) continue;
    socCd[key]=nowMs+25000;
    PG.Dog.setAction(d0,'play',yard,{});
    PG.Dog.setAction(tr,'play',yard,{});
    spawnHearts(d0.pos[0],d0.pos[2]);
    PG.Care.grantXp(S,6,nowMs);
    var _ff=F(); _ff.bond=PG.Care.clamp(_ff.bond+2);
    PG.Care.setMsg(S,'Play date! '+_ff.name+' and '+(tr._foster?tr._foster.name:((tr.app&&tr.app.name)||'a trainer'))+' are romping! +bond');
    save(); renderAll();
  }
}

/* per-game best/played, migrated once from the old flat fields */
function gameStats(id){
  S.gameStats=S.gameStats||{};
  var st=S.gameStats[id]||(S.gameStats[id]={best:0,played:0});
  if(!st.migrated){
    if(id==='m3'){ st.best=Math.max(st.best,S.m3best|0); st.played=Math.max(st.played,S.m3games|0); }
    if(id==='dk'){ st.best=Math.max(st.best,S.dkbest|0); st.played=Math.max(st.played,S.dkgames|0); }
    st.migrated=true;
  }
  return st;
}
var curGame=null, curGameId='m3';
function gameDef(id){ for(var i=0;i<GAMES.length;i++) if(GAMES[i].id===id) return GAMES[i]; return GAMES[0]; }
function awardGame(id,bones){
  if(!(bones>0)) { renderGBest(); return; }
  var mult=1+PG.Care.streakBonus(S);
  bones=Math.round(bones*mult);
  S.bones+=bones;
  var st=gameStats(id);
  st.played++; if(bones>st.best)st.best=bones;
  var nm=gameDef(id).name;
  PG.Care.setMsg(S,nm+' earned '+bones+' Bones!'+(mult>1?' ('+S.streak+'-day streak!)':''));
  save(); renderBones(); renderMsg(); renderGBest();
}
function renderGBest(){
  var d=gameDef(curGameId), el=q('.pg-gbest');
  if(!el) return;
  var st=gameStats(curGameId);
  el.textContent=st.played? ('Best: '+st.best+' Bones · '+st.played+' games played') : d.blurb;
}
function renderGTabs(){
  var bar=q('.pg-gtabs'); if(!bar) return;

  GAMES.forEach(function(d){
    var b=document.createElement('button');
    b.type='button'; b.textContent=d.name;
    if(d.id===curGameId) b.classList.add('on');
    b.addEventListener('click',function(){ openGame(d.id); });

/* touch buttons for games that declare them; trick:N actions call pressTrick */
function renderGameBtns(){
  var wrap=q('.pg-gamebtns'); if(!wrap) return;
  wrap.innerHTML=''; wrap._btns=[];
  var d=gameDef(curGameId);
  if(!d.buttons||!curGame){ wrap.hidden=true; return; }
  wrap.hidden=false;
  var g=curGame;
  d.buttons.forEach(function(cfg,idx){
    var b=document.createElement('button');
    b.type='button'; b.textContent=cfg[0]; b.className='pg-gbtn'+(cfg[2]?' acc':'');
    var act=cfg[1];
    /* cfg[3]==='tap': momentary pulse (stays true 160ms) so quick taps
     * are never missed between frames; otherwise the flag is held. */
    function down(e){
      if(e) e.preventDefault();
      if(act.indexOf('trick:')===0){ if(g.pressTrick) g.pressTrick(+act.slice(6)); return; }
      g.input[act]=true;
      if(cfg[3]==='tap'){ clearTimeout(b._pulse); b._pulse=setTimeout(function(){ g.input[act]=false; },160); }
    }
    function up(){
      if(act.indexOf('trick:')===0) return;
      if(cfg[3]==='tap') return; // pulse handles release
      g.input[act]=false;
    }
    b.addEventListener('pointerdown',down);
    b.addEventListener('pointerup',up);
    b.addEventListener('pointercancel',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    wrap.appendChild(b); wrap._btns.push(b);
  });
}
function flashGameBtn(i){
  var wrap=q('.pg-gamebtns');
  if(!wrap||!wrap._btns||!wrap._btns[i]) return;
  var b=wrap._btns[i];
  b.classList.add('flash');
  setTimeout(function(){ b.classList.remove('flash'); },380);
}
function openGame(id){
  closeGame();
  curGameId=id;
  var d=gameDef(id), mod=PG[d.mod];
  renderGTabs();
  var stage=q('.pg-gstage');
  if(stage){ stage.classList.remove('g-m3','g-dk','g-ver','g-run'); stage.classList.add(d.aspect); }
  if(!mod) return;
  try{
    curGame=mod.create(q('.pg-game'),{onEnd:function(bones){ var b=curGame; if(b){try{b.destroy();}catch(e){}} curGame=null; awardGame(id,bones); renderGameBtns(); }, flash:flashGameBtn});
    curGame.start();
  }catch(e){ curGame=null; }
  renderGBest(); renderGameBtns();
}
function closeGame(){
  if(curGame){ try{ var b=curGame.bonesEarned|0; curGame.destroy(); if(b>0) awardGame(curGameId,b); }catch(e){} curGame=null; }
  var wrap=q('.pg-gamebtns'); if(wrap) wrap.hidden=true;
}
