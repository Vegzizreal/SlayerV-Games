      '<div class="row"><span>Trainers</span><b>'+d.trainers+'</b></div>'+
      '<div class="pg-redesc">'+d.desc+'</div>';
    var row=document.createElement('div'); row.className='pg-rnrow';
    if(isCur){
      var cur2=document.createElement('span');
      cur2.style.cssText='font-weight:800;color:var(--hatch-widget-accent)';
      cur2.textContent='\u2713 Current home';
      row.appendChild(cur2);
    }else if(owned){
      var mv=document.createElement('button');
      mv.type='button'; mv.className='pg-btn acc'; mv.textContent='Move here';
      mv.addEventListener('click',function(){
        var r=setProperty(d.id);
        if(r.ok){ PG.Care.setMsg(S,'Welcome home! Moved to '+d.name+'.'); }
        else PG.Care.setMsg(S,r.error);
        renderRealEstateTab(); renderAll();
      });
      row.appendChild(mv);
    }else{
      var by=document.createElement('button');
      by.type='button'; by.className='pg-btn acc'; by.textContent='Buy \u2014 '+d.cost+' Bones';
      by.disabled=S.bones<d.cost;
      by.addEventListener('click',function(){
        var r=PG.Props.buy(S,d.id);
        if(r.ok){
          S.lastCare=Date.now(); save();
          PG.Care.setMsg(S,'You bought '+d.name+'! ('+d.fosters+' fosters, '+d.trainers+' trainers)');
        }else PG.Care.setMsg(S,r.error);
        renderRealEstateTab(); renderAll();
      });
      row.appendChild(by);
    }
    card.appendChild(row);
    el.appendChild(card);
  });
}

/* ---------- simulation tick ---------- */
function doTick(){
  var ev=PG.Care.tick(S,Date.now());
  ev.forEach(function(e){
    var d=(e.i>=0&&dogs[e.i])?dogs[e.i]:null;
    var fn=e.i>=0&&S.fosters[e.i]?S.fosters[e.i].name:'';
    if(e.t==='poop'){
      var a=rnd(0,Math.PI*2), rr=rnd(1,4);
      PG.Yard.addPoop(yard,Math.cos(a)*rr,Math.sin(a)*rr);
      if(d) PG.Dog.setAction(d,'poop',yard,{});
    }
    else if(e.t==='sick'){ if(d) PG.Dog.setAction(d,'sick',yard); }
    else if(e.t==='recovered'){ if(d) PG.Dog.setAction(d,'cured',yard); }
    else if(e.t==='critical'){ if(d) PG.Dog.setAction(d,'sick',yard); PG.Care.setMsg(S,fn+' is in CRITICAL condition! No XP until a vet visit!'); }
    else if(e.t==='storm'){ if(d) PG.Dog.setAction(d,'sick',yard); }
    else if(e.t==='shoe'){ if(d) PG.Dog.setAction(d,'idle',yard); }
  });
  if(ev.length){ save(); renderAll(); }
}

/* ---------- state sync ---------- */
if(bridge){
  window.addEventListener('hatch-widget-state',function(e){
    if(!e.detail||!e.detail.state) return;
    var incSeq=e.detail.state._saveSeq;
    if(typeof incSeq==='number'&&incSeq<_saveSeq) return; // stale echo: our newer save wins
    if(typeof incSeq==='number') _saveSeq=incSeq;
    S=PG.Care.normalize(Object.assign({},DEF,e.detail.state));
    rebuildDogs();
    renderAll();
    applyTheme();
    if(S.tab) setTab(S.tab);
  });
}

/* ---------- first-run welcome: name + breed + import/scan or random ---------- */
function showWelcome(){
  if(!PG.MyDog||q('.pg-welcome')) return;
  var ov=document.createElement('div'); ov.className='pg-welcome';
  var card=document.createElement('div'); card.className='pg-welcome-card';
  ov.appendChild(card);
  q('.pg').appendChild(ov);
  var F=F();
  PG.MyDog.renderWizard(card,
    {breed:F.breed,fur:F.fur,belly:F.belly,mark:F.mark},
    function(p){
      PG.Care.applyCoat(F,p);
      F.level=1; F.xp=0; F.arrivedAt=Date.now();
      S.setupDone=true; S.lastCare=Date.now();
      PG.Care.setMsg(S,'Welcome home, '+F.name+'! \u2764\ufe0f');
      rebuildDogs(); save(); renderAll();
      ov.remove();
    },
    {cta:'Start fostering!'});
}

/* ---------- boot ---------- */
renderAll();
applyTheme();
awardM3(0);
// ?tab=ID test hook (screenshots): boot straight into a tab
var _bootTab='yard';
try{ var _tm=/[?&]tab=([a-z]+)/.exec(window.location.search||''); if(_tm&&q('.pane-'+_tm[1])) _bootTab=_tm[1]; }catch(e){}
setTab(_bootTab);
doTick();
setInterval(doTick,30000);
setInterval(renderMsg,1500);
/* ---------- auto-save: every 20s, and whenever the page/widget is hidden/closed ----------
 * Widget: persists through the hatch bridge. Standalone browser: persists via
 * PG.WebSave (web build only). Export/import stays as the manual
 * cross-device transfer. */
setInterval(function(){ save(); },20000);
function saveOnHide(){ try{ closeGame(); }catch(e){} save(); }
window.addEventListener('pagehide',saveOnHide);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden') saveOnHide();
});
requestAnimationFrame(frame);
// first-run onboarding: real users get the welcome prompt; demo skips it unless ?welcome=1
var _wantWelcome=bridge ? !S.setupDone : /welcome/.test(window.location.search||'');
if(_wantWelcome) showWelcome();

/* ---------- responsive fit: edge-to-edge on wide screens + foldable detection ----------
   Snaps the game to all corners on big displays (fold inner screen). Detects
   true foldable span postures via getWindowSegments() and straddles the hinge:
   yard on one screen, controls on the other. Also bumps the 3D canvas render
   resolution on wide layouts so the yard stays crisp. */
function pgFitViewport(){
  var root=q('.pg'); if(!root) return;
  var wide=false;
  try{ wide=window.matchMedia('(min-width:720px)').matches; }catch(e){ wide=(window.innerWidth||0)>=720; }
  root.classList.toggle('pg-wide',wide);
  var segs=null;
  try{ segs=(typeof window.getWindowSegments==='function')?window.getWindowSegments():null; }catch(e){ segs=null; }
  var spanned=!!(segs&&segs.length>1);
  root.classList.toggle('pg-spanned',spanned);
  var yp=q('.pane-yard');
  if(yp){ yp.style.gridTemplateColumns=''; yp.style.columnGap=''; }
  if(spanned&&segs.length===2&&yp){
    var a=segs[0],b=segs[1];
    if(Math.abs(a.y-b.y)<4&&Math.abs(a.height-b.height)<4){
      var leftW=Math.round(Math.min(a.width,b.width));
      var hinge=Math.round(Math.max(0,Math.max(a.x,b.x)-(Math.min(a.x,b.x)+leftW)));
      yp.style.gridTemplateColumns=leftW+'px minmax(0,1fr)';
      yp.style.columnGap=(hinge+16)+'px';
    }
  }
  var ycv=q('.pg-yard3d');
  if(ycv){
    var tW=wide?960:640, tH=wide?600:400;
    if(ycv.width!==tW){ ycv.width=tW; ycv.height=tH; W=tW; H=tH; }
  }
}
var _pgFitT=null;
function pgFitSoon(){ if(_pgFitT) clearTimeout(_pgFitT); _pgFitT=setTimeout(pgFitViewport,120); }
pgFitViewport();
window.addEventListener('resize',pgFitSoon);
window.addEventListener('orientationchange',pgFitSoon);
if(window.visualViewport&&visualViewport.addEventListener) visualViewport.addEventListener('resize',pgFitSoon);

if(!bridge){
  window.__pg={
    dog:function(){ return selDog(); },
    dogs:function(){ return dogs; },
    state:function(){ return S; },
    act:act,
    m3:function(){ return curGameId==='m3'?curGame:null; },
    dk:function(){ return curGameId==='dk'?curGame:null; },
    game:function(){ return curGame; },
    gameId:function(){ return curGameId; },
    openGame:function(id){ openGame(id); },
    adopt:function(outcome){ var sc=outcome==='perfect'?95:70; showAdoption({outcome:outcome,reward:outcome==='perfect'?150+(sc-85)*5:50+sc,score:sc}); },
    respawn:function(app){ Object.assign(F(),app||{}); rebuildDogs(); renderAll(); return selDog(); },
    yard:function(){ return yard; }
  };
}
})();

</script>
